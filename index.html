      v: { lab: 'v — velocità del fluido', unit: 'm/s', needs: ['Re', 'rho', 'D', 'eta'], run: x => { const r = x.Re * x.eta / (x.rho * x.D); return { value: r, resultText: `v = ${pnum(r)} m/s`, steps: ['Parto da Re = ρ·v·D / η', 'Isolo v: v = Re·η / (ρ·D)', `Sostituisco: v = ${pnum(x.Re)}·${pnum(x.eta)} / (${pnum(x.rho)}·${pnum(x.D)})`, `Calcolo: v = ${pnum(r)} m/s`] }; } }
    }
  }
];

function buildSolver(container) {
  const probSel = el('select'); probSel.setAttribute('aria-label', 'Tipo di problema');
  PROBLEMS.forEach((p, i) => probSel.add(new Option(p.label, i)));
  const targetSel = el('select'); targetSel.setAttribute('aria-label', 'Cosa calcolare');
  const formulaHint = el('div', 'formula-hint');
  const grid = el('div', 'grid');
  const ansWrap = el('div', 'field');
  ansWrap.innerHTML = `<label>La tua risposta <span class="u"></span> <span style="font-weight:400">(facoltativa)</span></label><input type="text" placeholder="scrivi qui il tuo risultato">`;
  const btn = el('button', 'btn-primary'); btn.textContent = 'Risolvi e verifica'; btn.style.marginTop = '4px';
  const out = el('div');

  const picker = el('div', 'picker');
  const c1 = el('div', 'ctrl'); c1.innerHTML = '<label style="font-size:.82rem;color:var(--text-soft);font-weight:600;display:block;margin-bottom:4px">Tipo di problema</label>'; c1.appendChild(probSel);
  const c2 = el('div', 'ctrl'); c2.innerHTML = '<label style="font-size:.82rem;color:var(--text-soft);font-weight:600;display:block;margin-bottom:4px">Cosa vuoi calcolare?</label>'; c2.appendChild(targetSel);
  picker.append(c1, c2);
  container.append(picker, formulaHint, grid, ansWrap, btn, out);

  const curProblem = () => PROBLEMS[+probSel.value];
  const curTarget = () => curProblem().targets[targetSel.value];

  function renderTargets() {
    const p = curProblem(); targetSel.innerHTML = '';
    Object.keys(p.targets).forEach(k => targetSel.add(new Option(p.targets[k].lab, k)));
  }
  function renderInputs() {
    const p = curProblem(); const tgt = curTarget();
    formulaHint.textContent = 'Formula: ' + p.formula;
    grid.innerHTML = '';
    Object.keys(p.vars).forEach(key => {
      const v = p.vars[key];
      const f = el('div', 'field');
      const dis = (key === targetSel.value);
      const val = v.def != null ? v.def : '';
      f.innerHTML = `<label>${v.lab} <span class="u">${v.unit || ''}</span></label>` +
        `<input type="text" data-k="${key}" placeholder="${dis ? '(la calcolo io)' : (v.ph || '')}" value="${dis ? '' : val}" ${dis ? 'disabled' : ''}>`;
      grid.appendChild(f);
    });
    ansWrap.querySelector('.u').textContent = tgt.unit || '';
    ansWrap.style.display = tgt.checkable === false ? 'none' : '';
    out.innerHTML = '';
  }
  function solve() {
    const p = curProblem(); const tgt = curTarget(); const x = {};
    grid.querySelectorAll('input').forEach(inp => {
      const raw = inp.value.trim().replace(',', '.');
      x[inp.dataset.k] = raw === '' ? NaN : parseFloat(raw);
    });
    const missing = tgt.needs.filter(k => !isFinite(x[k]));
    if (missing.length) {
      out.innerHTML = `<div class="solver-err">⚠ Inserisci un valore numerico valido per: ${missing.map(k => p.vars[k].lab.split(' — ')[0]).join(', ')}.</div>`;
      return;
    }
    let res;
    try { res = tgt.run(x); } catch (e) { out.innerHTML = `<div class="solver-err">⚠ Controlla i dati inseriti.</div>`; return; }
    if (res.value != null && !isFinite(res.value)) {
      out.innerHTML = `<div class="solver-err">⚠ Con questi dati il calcolo non è definito (forse c'è uno zero in un denominatore).</div>`;
      return;
    }
    let html = `<div class="method-box"><h4>📐 Metodo</h4>${res.steps.map(st => `<div class="step">▸ ${st}</div>`).join('')}</div>`;
    html += `<div class="result-pill">✔ ${res.resultText}</div>`;
    if (tgt.checkable !== false) {
      const ansRaw = (ansWrap.querySelector('input').value || '').trim().replace(',', '.');
      if (ansRaw !== '') {
        const ans = parseFloat(ansRaw);
        if (isFinite(ans)) {
          const ok = Math.abs(ans - res.value) <= Math.max(Math.abs(res.value) * 0.02, 1e-9);
          html += `<div class="feedback ${ok ? 'ok' : 'no'} show" style="margin-top:12px">` +
            (ok ? '✅ <b>La tua risposta è corretta!</b> Ottimo lavoro. 🌟'
                : 'La tua risposta non coincide con il valore atteso. 🌱 <span class="why">Rivedi i passaggi del metodo qui sopra e riprova: sei sulla buona strada.</span>') +
            `</div>`;
        }
      }
    }
    out.innerHTML = html;
  }

  probSel.onchange = () => { renderTargets(); renderInputs(); };
  targetSel.onchange = renderInputs;
  btn.onclick = solve;
  renderTargets(); renderInputs();
}

function buildSection(s, i) {
  const sec = document.createElement('section');
  sec.className = 'section' + (i === currentIndex ? ' active' : '');
  sec.id = 'sec-' + s.id;

  const head = `${s.kicker ? `<div class="kicker">${s.kicker}</div>` : ''}<h1>${s.title}</h1>`;
  // liste generalizzate: un modulo può avere più simulazioni e più esercizi
  const simList = s.sims || (s.anim ? [{ anim: s.anim, caption: s.animCaption }] : []);
  const exList = s.exercises || (s.example ? [s.example] : []);
  const isModule = !!(simList.length || exList.length || s.quiz) && !s.solver;

  // --- blocco Simulazioni (una o più) ---
  const animBlock = simList.length ? simList.map((sim, idx) => `
    <div class="anim-wrap card">
      <h3>🎬 ${sim.title ? sim.title + ' — ' : 'Simulazione — '}muovi i cursori e osserva</h3>
      <div class="canvas-box"><canvas id="cv-${s.id}-${idx}"></canvas></div>
      <div id="ctrl-${s.id}-${idx}"></div>
      <p style="color:var(--text-soft);font-size:.86rem;margin-top:10px">${sim.caption || ''}</p>
    </div>`).join('') : '';

  // --- blocco Esercizi: uno o più, con suggerimenti progressivi ---
  const eserBlock = exList.length ? (exList.map((ex, idx) => {
    const stepsHtml = ex.steps ? ex.steps.map(st => `<div class="step">▸ ${st}</div>`).join('') : '';
    const hintsHtml = ex.hints ? ex.hints.map((h, k) => `<div class="hint" style="display:none">💡 <b>Suggerimento ${k + 1}:</b> ${h}</div>`).join('') : '';
    const label = exList.length > 1 ? `✏️ Esercizio ${idx + 1} di ${exList.length}` : '✏️ Esercizio svolto';
    return `
    <div class="card example">
      <span class="tag">${label}${ex.tag ? ' · ' + ex.tag : ''}</span>
      <h3 style="margin-top:10px">${ex.title}</h3>
      ${ex.body}
      ${ex.answer != null ? `<div class="eser-verify">
        <label>La tua risposta <span class="u">${ex.unit || ''}</span></label>
        <input type="text" id="ans-${s.id}-${idx}" placeholder="scrivi un numero">
        <button class="btn-primary" id="ans-btn-${s.id}-${idx}" style="padding:8px 16px">Verifica</button>
        <div class="feedback" id="ansfb-${s.id}-${idx}"></div>
      </div>` : ''}
      <div class="hints" id="hints-${s.id}-${idx}">${hintsHtml}</div>
      <div class="eser-actions">
        ${ex.hints && ex.hints.length ? `<button class="btn-ghost" id="hint-btn-${s.id}-${idx}">💡 Dammi un suggerimento</button>` : ''}
        <button class="btn-ghost" id="sol-btn-${s.id}-${idx}">Mostra la soluzione completa</button>
      </div>
      <div class="solution" id="sol-${s.id}-${idx}">
        ${stepsHtml}
        <div class="result-pill">✔ ${ex.result}</div>
      </div>
    </div>`;
  }).join('')) + `<p style="color:var(--text-soft);font-size:.86rem;margin-top:12px">Vuoi provare con i tuoi numeri? Vai alla scheda <b>🧮 Risolutore</b> in alto.</p>` : '';

  // --- blocco Quiz (opzionale) ---
  const quizBlock = s.quiz ? `
    <div class="card quiz" id="quiz-${s.id}">
      <h2 style="margin-top:0">🎯 Quiz del modulo</h2>
      <div class="qcount">Rispondi per fissare i concetti. Puoi ripetere il quiz quando vuoi.</div>
      <div id="quizbody-${s.id}"></div>
    </div>` : '';

  // --- blocco Risolutore (solo scheda dedicata) ---
  const solverBlock = s.solver ? `
    <div class="card solver" id="solver-${s.id}">
      <h2 style="margin-top:0">🧮 Inserisci i tuoi dati</h2>
      <div id="solverbody-${s.id}"></div>
    </div>` : '';

  // --- blocco Quiz finale riepilogativo (scheda dedicata) ---
  const finalBlock = s.finalQuiz ? `
    <div class="card quiz" id="final-${s.id}">
      <h2 style="margin-top:0">🏆 Quiz finale riepilogativo</h2>
      <div class="qcount">${s.finalQuiz.length} domande da tutti i moduli. Il punteggio e le soluzioni appaiono solo alla fine.</div>
      <div id="finalbody-${s.id}"></div>
    </div>` : '';

  // --- navigazione tra schede ---
  const navBtns = `
    <div class="section-nav">
      <button class="btn-ghost" id="prev-${s.id}" ${i === 0 ? 'disabled' : ''}>← Scheda precedente</button>
      <button class="btn-primary" id="next-${s.id}" ${i === SECTIONS.length - 1 ? 'disabled' : ''}>Scheda successiva →</button>
    </div>`;

  // --- corpo: moduli con sotto-schede, altre schede a pagina singola ---
  let bodyHtml;
  if (isModule) {
    const subs = [['teoria', '📖 Teoria', `<div class="theory">${s.theory}</div>`]];
    if (simList.length) subs.push(['sim', '🎬 Simulazioni', animBlock]);
    if (exList.length) subs.push(['eser', '✏️ Esercizi', eserBlock]);
    if (s.quiz) subs.push(['quiz', '🎯 Quiz', quizBlock]);
    const bar = `<div class="subtabs">${subs.map((t, k) => `<button class="subtab${k === 0 ? ' active' : ''}" data-sub="${t[0]}">${t[1]}</button>`).join('')}</div>`;
    const panels = subs.map((t, k) => `<div class="subpanel${k === 0 ? ' active' : ''}" data-panel="${t[0]}">${t[2]}</div>`).join('');
    bodyHtml = bar + panels;
  } else {
    bodyHtml = `<div class="theory">${s.theory || ''}</div>` + solverBlock + finalBlock;
  }

  sec.innerHTML = head + bodyHtml + navBtns;
  mainEl.appendChild(sec);

  // wiring: navigazione tra schede
  sec.querySelector('#prev-' + s.id).addEventListener('click', () => goTo(i - 1));
  sec.querySelector('#next-' + s.id).addEventListener('click', () => goTo(i + 1));

  // wiring: sotto-schede + ciclo di vita delle animazioni
  if (isModule) {
    const subtabs = [...sec.querySelectorAll('.subtab')];
    const panels = [...sec.querySelectorAll('.subpanel')];
    subtabs.forEach(tb => tb.addEventListener('click', () => {
      subtabs.forEach(x => x.classList.remove('active'));
      tb.classList.add('active');
      panels.forEach(p => p.classList.toggle('active', p.dataset.panel === tb.dataset.sub));
      if (tb.dataset.sub === 'sim') startAnims(animInstances[s.id]); else stopRunningAnims();
    }));
  }

  // wiring: suggerimenti progressivi + soluzione completa (per ogni esercizio)
  exList.forEach((ex, idx) => {
    if (ex.hints && ex.hints.length) {
      let shown = 0;
      const hintBtn = sec.querySelector(`#hint-btn-${s.id}-${idx}`);
      const hintEls = [...sec.querySelectorAll(`#hints-${s.id}-${idx} .hint`)];
      hintBtn.addEventListener('click', () => {
        if (shown < hintEls.length) { hintEls[shown].style.display = 'block'; shown++; }
        if (shown >= hintEls.length) { hintBtn.disabled = true; hintBtn.textContent = 'Nessun altro suggerimento'; }
      });
    }
    sec.querySelector(`#sol-btn-${s.id}-${idx}`).addEventListener('click', e => {
      const sol = sec.querySelector(`#sol-${s.id}-${idx}`);
      sol.classList.toggle('show');
      e.target.textContent = sol.classList.contains('show') ? 'Nascondi la soluzione' : 'Mostra la soluzione completa';
    });
    // verifica della risposta numerica
    if (ex.answer != null) {
      const ansBtn = sec.querySelector(`#ans-btn-${s.id}-${idx}`);
      const ansInp = sec.querySelector(`#ans-${s.id}-${idx}`);
      const ansFb = sec.querySelector(`#ansfb-${s.id}-${idx}`);
      const check = () => {
        const raw = (ansInp.value || '').trim().replace(',', '.');
        if (raw === '') { ansFb.className = 'feedback no show'; ansFb.innerHTML = '✍️ Scrivi prima la tua risposta.'; return; }
        const val = parseFloat(raw);
        if (!isFinite(val)) { ansFb.className = 'feedback no show'; ansFb.innerHTML = '⚠ Inserisci un numero valido.'; return; }
        const ok = Math.abs(val - ex.answer) <= Math.max(Math.abs(ex.answer) * 0.02, 1e-9);
        ansFb.className = 'feedback ' + (ok ? 'ok' : 'no') + ' show';
        ansFb.innerHTML = ok
          ? '✅ <b>Corretto!</b> Ottimo lavoro. 🌟'
          : 'Non è il valore atteso. 🌱 <span class="why">Prova con i suggerimenti, poi controlla la soluzione completa qui sotto.</span>';
      };
      ansBtn.addEventListener('click', check);
      ansInp.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
    }
  });

  // wiring: animazioni + controlli (istanze create, avviate solo nella sotto-scheda Simulazioni)
  if (simList.length) {
    animInstances[s.id] = simList.map((sim, idx) => {
      const canvas = sec.querySelector(`#cv-${s.id}-${idx}`);
      const inst = Animations[sim.anim](canvas);
      if (inst.controls) sec.querySelector(`#ctrl-${s.id}-${idx}`).appendChild(inst.controls);
      return inst;
    });
  }

  // quiz
  if (s.quiz) renderQuiz(s);

  // risolutore
  if (s.solver) buildSolver(sec.querySelector('#solverbody-' + s.id));

  // quiz finale riepilogativo
  if (s.finalQuiz) buildFinalQuiz(sec.querySelector('#finalbody-' + s.id), s);
}

/* ============================================================
   QUIZ (una domanda alla volta, opzioni mescolate)
   ============================================================ */
const quizState = {}; // id -> { order:[...], idx, correctCount, answered }

function renderQuiz(s) {
  const body = document.getElementById('quizbody-' + s.id);
  quizState[s.id] = { order: s.quiz.map((_, k) => k), idx: 0, correctCount: 0 };
  showQuestion(s);
}

function showQuestion(s) {
  const st = quizState[s.id];
  const body = document.getElementById('quizbody-' + s.id);
  const total = s.quiz.length;

  if (st.idx >= total) { showQuizDone(s); return; }

  const qi = st.order[st.idx];
  const question = s.quiz[qi];
  // opzioni con posizione casuale
  const optOrder = shuffle(question.opts.map((_, k) => k));

  const dots = s.quiz.map((_, k) =>
    `<div class="dot ${k < st.idx ? 'done' : k === st.idx ? 'current' : ''}"></div>`).join('');

  body.innerHTML = `
    <div class="quiz-progress">${dots}</div>
    <div class="qcount">Domanda ${st.idx + 1} di ${total}</div>
    <div class="qcat ${question.num ? 'num' : 'teo'}">${question.num ? '🔢 Domanda numerica' : '📖 Domanda di teoria'}</div>
    <div class="qtext">${question.q}</div>
    <div class="options" id="opts-${s.id}"></div>
    <div class="feedback" id="fb-${s.id}"></div>
    <div class="quiz-actions">
      <button class="btn-primary" id="nextq-${s.id}" disabled>Continua →</button>
    </div>`;

  const optsEl = body.querySelector('#opts-' + s.id);
  optOrder.forEach((origIdx, pos) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="key">${LETTERS[pos]}</span><span>${question.opts[origIdx]}</span>`;
    btn.addEventListener('click', () => answer(s, btn, origIdx, question, optsEl));
    optsEl.appendChild(btn);
  });
}

function answer(s, btn, origIdx, question, optsEl) {
  const st = quizState[s.id];
  const fb = document.getElementById('fb-' + s.id);
  const nextBtn = document.getElementById('nextq-' + s.id);
  const isRight = origIdx === question.correct;

  // disabilita tutte, evidenzia
  [...optsEl.children].forEach(b => {
    b.disabled = true;
    const label = b.querySelector('span:last-child').textContent;
    if (label === question.opts[question.correct]) b.classList.add('correct');
  });
  if (!isRight) btn.classList.add('wrong');

  if (isRight) {
    st.correctCount++;
    fb.className = 'feedback ok show';
    fb.innerHTML = `✅ <b>Esatto!</b> <span class="why">${question.why}</span>`;
  } else {
    fb.className = 'feedback no show';
    fb.innerHTML = `Non proprio, ma è così che si impara. 🌱 <span class="why">${question.why}</span>`;
  }
  nextBtn.disabled = false;
  nextBtn.onclick = () => { st.idx++; showQuestion(s); };
}

function showQuizDone(s) {
  const st = quizState[s.id];
  const body = document.getElementById('quizbody-' + s.id);
  const total = s.quiz.length;
  const score = st.correctCount;
  const perfect = score === total;

  // segna la sezione come completata (se almeno provata fino in fondo)
  progress[s.id] = true; saveProgress(); buildNav(); updateGlobal();

  let msg, emoji;
  if (perfect) { emoji = '🏆'; msg = 'Perfetto, tutte corrette! Hai padroneggiato questa sezione.'; }
  else if (score >= total - 1) { emoji = '🌟'; msg = 'Ottimo lavoro! Ci sei quasi al 100%.'; }
  else if (score >= total / 2) { emoji = '👍'; msg = 'Bel risultato! Rileggi la teoria dei punti incerti e riprova: migliorerai di sicuro.'; }
  else { emoji = '🌱'; msg = 'Ogni errore è un passo avanti. Rivedi con calma la teoria e riprova: andrà meglio!'; }

  body.innerHTML = `
    <div class="quiz-done">
      <div class="big">${emoji}</div>
      <h3>${score} / ${total} corrette</h3>
      <p style="color:var(--text-soft);max-width:460px;margin:6px auto 18px">${msg}</p>
      <button class="btn-primary" id="retry-${s.id}">↻ Rifai il quiz</button>
      ${currentIndex < SECTIONS.length - 1 ? `<button class="btn-ghost" id="go-next-${s.id}" style="margin-left:8px">Vai alla prossima sezione →</button>` : ''}
    </div>`;
  body.querySelector('#retry-' + s.id).addEventListener('click', () => renderQuiz(s));
  const gn = body.querySelector('#go-next-' + s.id);
  if (gn) gn.addEventListener('click', () => goTo(currentIndex + 1));
}

/* ============================================================
   QUIZ FINALE RIEPILOGATIVO
   (nessun riscontro per domanda; punteggio e soluzioni alla fine)
   ============================================================ */
function buildFinalQuiz(container, s) {
  const qs = s.finalQuiz;
  let order, answers, idx;

  function start(pool) {
    const base = (pool && pool.length) ? pool : qs.map((_, k) => k);
    order = shuffle(base);
    answers = new Array(order.length).fill(null); // per posizione: { qi, chosen }
    idx = 0;
    render();
  }

  function render() {
    const total = order.length;
    if (idx >= total) { results(); return; }
    const qi = order[idx];
    const question = qs[qi];
    const optOrder = shuffle(question.opts.map((_, k) => k));
    const dots = order.map((_, k) => `<span class="dot ${answers[k] != null ? 'done' : (k === idx ? 'current' : '')}"></span>`).join('');
    const last = idx === total - 1;
    const subsetNote = total < qs.length
      ? `<div class="callout tip" style="margin:0 0 12px"><span class="lbl">🔁 Ripasso mirato</span> Stai rivedendo solo le ${total} domande che avevi sbagliato.</div>`
      : '';
    container.innerHTML = `
      ${subsetNote}
      <div class="quiz-progress">${dots}</div>
      <div class="qcount">Domanda ${idx + 1} di ${total}</div>
      <div class="qtext">${question.q}</div>
      <div class="options" id="fq-opts"></div>
      <div class="quiz-actions">
        <button class="btn-ghost" id="fq-prev" ${idx === 0 ? 'disabled' : ''}>← Indietro</button>
        <button class="btn-primary" id="fq-next" disabled>${last ? 'Vedi il risultato →' : 'Prossima →'}</button>
      </div>`;
    const optsEl = container.querySelector('#fq-opts');
    let chosen = answers[idx] ? answers[idx].chosen : null;
    optOrder.forEach((origIdx, pos) => {
      const btn = document.createElement('button');
      btn.className = 'opt' + (chosen === origIdx ? ' sel' : '');
      btn.innerHTML = `<span class="key">${LETTERS[pos]}</span><span>${question.opts[origIdx]}</span>`;
      btn.addEventListener('click', () => {
        chosen = origIdx;
        answers[idx] = { qi, chosen: origIdx };
        [...optsEl.children].forEach(c => c.classList.remove('sel'));
        btn.classList.add('sel');
        container.querySelector('#fq-next').disabled = false;
      });
      optsEl.appendChild(btn);
    });
    if (chosen != null) container.querySelector('#fq-next').disabled = false;
    container.querySelector('#fq-next').addEventListener('click', () => { idx++; render(); });
    container.querySelector('#fq-prev').addEventListener('click', () => { if (idx > 0) { idx--; render(); } });
  }

  function results() {
    const total = order.length;
    let score = 0;
    answers.forEach((a, k) => { if (a && a.chosen === qs[order[k]].correct) score++; });
    // segna il quiz finale come completato → conta nella barra di progresso
    progress[s.id] = true; saveProgress(); buildNav(); updateGlobal();
    // domande sbagliate (o non risposte), come indici in qs
    const wrong = order.filter((qi, k) => !(answers[k] && answers[k].chosen === qs[qi].correct));
    const isSubset = total < qs.length;

    let emoji, msg;
    if (score === total && !isSubset) { emoji = '🏆'; msg = 'Perfetto: tutte corrette! Hai davvero padroneggiato la fluidodinamica.'; }
    else if (score === total && isSubset) { emoji = '🎯'; msg = 'Ottimo! Hai recuperato tutte le domande che avevi sbagliato.'; }
    else if (score >= total - Math.max(1, Math.round(total * 0.15))) { emoji = '🌟'; msg = 'Eccellente! Preparazione solidissima, ci sei quasi al massimo.'; }
    else if (score >= total * 0.7) { emoji = '👏'; msg = 'Molto bene! Ottimo lavoro complessivo: rivedi giusto qualche punto.'; }
    else if (score >= total * 0.5) { emoji = '👍'; msg = 'Buon risultato! Ripassa i moduli dei quesiti sbagliati e riprova: migliorerai di sicuro.'; }
    else { emoji = '🌱'; msg = 'È un ottimo punto di partenza. Rivedi con calma la teoria dei moduli e riprova: farai un bel salto in avanti!'; }

    const review = order.map((qi, k) => {
      const question = qs[qi];
      const a = answers[k];
      const chosen = a ? a.chosen : null;
      const ok = chosen === question.correct;
      const yourAns = chosen != null ? question.opts[chosen] : '(nessuna risposta)';
      return `<div class="fq-item">
        <div class="fq-q">${k + 1}. ${question.q}</div>
        <div class="fq-line">La tua risposta: <span class="${ok ? 'fq-ok' : 'fq-no'}">${yourAns} ${ok ? '✓' : '✗'}</span></div>
        ${ok ? '' : `<div class="fq-line">Risposta corretta: <span class="fq-ok">${question.opts[question.correct]}</span></div>`}
        <div class="fq-why">${question.why}</div>
      </div>`;
    }).join('');

    container.innerHTML = `
      <div class="quiz-done">
        <div class="big">${emoji}</div>
        <h3>${score} / ${total} corrette</h3>
        <p style="color:var(--text-soft);max-width:520px;margin:6px auto 18px">${msg}</p>
        <button class="btn-primary" id="fq-retry">↻ Rifai tutto (20)</button>
        ${wrong.length ? `<button class="btn-ghost" id="fq-wrong" style="margin-left:8px">🔁 Riprova solo le sbagliate (${wrong.length})</button>` : ''}
      </div>
      <div class="fq-review">
        <h3>📋 Soluzioni commentate</h3>
        ${review}
      </div>`;
    container.querySelector('#fq-retry').addEventListener('click', () => { start(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
    const wb = container.querySelector('#fq-wrong');
    if (wb) wb.addEventListener('click', () => { start(wrong); window.scrollTo({ top: 0, behavior: 'smooth' }); });
  }

  start();
}

/* ============================================================
   NAVIGAZIONE + PROGRESSO GLOBALE
   ============================================================ */
function startAnims(list) {
  stopRunningAnims();
  if (!list || !list.length) return;
  runningAnims = list;
  list.forEach(inst => requestAnimationFrame(() => { inst.resize(); inst.start(); }));
}
function stopRunningAnims() { runningAnims.forEach(inst => inst.stop()); runningAnims = []; }

function resetSubtabs(sec) {
  if (!sec) return;
  const subtabs = [...sec.querySelectorAll('.subtab')];
  const panels = [...sec.querySelectorAll('.subpanel')];
  if (!subtabs.length) return;
  subtabs.forEach((t, idx) => t.classList.toggle('active', idx === 0));
  panels.forEach((p, idx) => p.classList.toggle('active', idx === 0));
}

function goTo(i) {
  if (i < 0 || i >= SECTIONS.length) return;
  stopRunningAnims(); // ogni modulo si apre sulla Teoria: nessuna animazione in corso
  currentIndex = i;
  const secs = [...document.querySelectorAll('.section')];
  secs.forEach((el, k) => el.classList.toggle('active', k === i));
  resetSubtabs(secs[i]); // riparti sempre dalla sotto-scheda Teoria
  buildNav();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updateGlobal() {
  const quizSections = SECTIONS.filter(s => s.quiz || s.finalQuiz);
  const done = quizSections.filter(s => progress[s.id]).length;
  const pct = Math.round(done / quizSections.length * 100);
  document.getElementById('globalFill').style.width = pct + '%';
  document.getElementById('globalPct').textContent = pct + '%';
}

/* ============================================================
   TEMA GIORNO / NOTTE
   ============================================================ */
const themeBtn = document.getElementById('themeBtn');
const themeLbl = document.getElementById('themeLbl');
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  themeBtn.firstChild.textContent = theme === 'dark' ? '☀️ ' : '🌙 ';
  themeLbl.textContent = theme === 'dark' ? 'Giorno' : 'Notte';
  readPalette();
  try { localStorage.setItem('fluidodinamica_theme', theme); } catch (e) {}
}
themeBtn.addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(cur);
});

/* ============================================================
   AVVIO
   ============================================================ */
function init() {
  // tema iniziale: salvato o preferenza di sistema
  let theme = 'light';
  try { theme = localStorage.getItem('fluidodinamica_theme'); } catch (e) {}
  if (!theme) theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  applyTheme(theme);

  SECTIONS.forEach((s, i) => buildSection(s, i));
  buildNav();
  updateGlobal();
  // la prima scheda (Introduzione) non ha animazioni: nessun avvio automatico.
}

// ridimensionamento
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { runningAnims.forEach(a => a.resize()); }, 180);
});

init();
</script>
