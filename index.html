<title>Fluidodinamica in movimento — Impara i fluidi in moto</title>
<style>
  /* ===================== TEMA E VARIABILI ===================== */
  :root {
    --bg: #eef3f8;
    --bg-grad-1: #e3edf7;
    --bg-grad-2: #eef3f8;
    --card: #ffffff;
    --card-2: #f6f9fc;
    --text: #16202b;
    --text-soft: #52606d;
    --accent: #1565c0;
    --accent-soft: #e3f0fc;
    --accent-2: #00897b;
    --accent-2-soft: #d8f2ee;
    --border: #dbe4ee;
    --shadow: 0 6px 22px rgba(21, 45, 80, .09);
    --good: #2e7d32;
    --good-soft: #e6f4ea;
    --bad: #c62828;
    --bad-soft: #fbe7e7;
    --warn: #ef6c00;
    --water: #2196f3;
    --water-deep: #0d47a1;
    --particle: #0d47a1;
  }
  [data-theme="dark"] {
    --bg: #0d1620;
    --bg-grad-1: #101d2b;
    --bg-grad-2: #0b131c;
    --card: #16232f;
    --card-2: #1b2a38;
    --text: #e7eef5;
    --text-soft: #9fb1c1;
    --accent: #4fc3f7;
    --accent-soft: #123244;
    --accent-2: #4db6ac;
    --accent-2-soft: #10322e;
    --border: #26394a;
    --shadow: 0 6px 24px rgba(0, 0, 0, .38);
    --good: #66bb6a;
    --good-soft: #17321d;
    --bad: #ef5350;
    --bad-soft: #37191a;
    --warn: #ffa726;
    --water: #4fc3f7;
    --water-deep: #0288d1;
    --particle: #b3e5fc;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    background:
      radial-gradient(1100px 700px at 82% -8%, var(--bg-grad-1), transparent 60%),
      var(--bg);
    line-height: 1.62;
    transition: background .4s ease, color .3s ease;
    -webkit-font-smoothing: antialiased;
  }

  /* ===================== HEADER ===================== */
  header {
    position: sticky; top: 0; z-index: 50;
    backdrop-filter: blur(10px);
    background: color-mix(in srgb, var(--card) 86%, transparent);
    border-bottom: 1px solid var(--border);
  }
  .head-inner {
    max-width: 1080px; margin: 0 auto; padding: 12px 20px;
    display: flex; align-items: center; gap: 14px;
  }
  .logo {
    display: flex; align-items: center; gap: 11px; font-weight: 800;
    font-size: 1.08rem; letter-spacing: .2px; white-space: nowrap;
  }
  .logo .drop { font-size: 1.5rem; }
  .head-spacer { flex: 1; }
  .progress-mini { display: flex; align-items: center; gap: 9px; font-size: .82rem; color: var(--text-soft); }
  .progress-track { width: 120px; height: 8px; border-radius: 99px; background: var(--card-2); overflow: hidden; border: 1px solid var(--border); }
  .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .5s cubic-bezier(.2,.8,.2,1); }
  .theme-btn {
    border: 1px solid var(--border); background: var(--card-2); color: var(--text);
    border-radius: 99px; padding: 8px 14px; cursor: pointer; font-size: .88rem; font-weight: 600;
    display: flex; align-items: center; gap: 7px; transition: transform .15s, background .3s;
  }
  .theme-btn:hover { transform: translateY(-1px); }
  .theme-btn:active { transform: translateY(0); }

  /* ===================== NAV ===================== */
  nav {
    max-width: 1080px; margin: 14px auto 0; padding: 0 20px;
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .nav-btn {
    border: 1px solid var(--border); background: var(--card); color: var(--text-soft);
    border-radius: 99px; padding: 8px 14px; cursor: pointer; font-size: .86rem; font-weight: 600;
    display: flex; align-items: center; gap: 7px; transition: all .18s;
  }
  .nav-btn:hover { border-color: var(--accent); color: var(--text); }
  .nav-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: var(--shadow); }
  .nav-btn .num { font-size: .72rem; opacity: .8; }
  .nav-btn .done { color: var(--good); }
  .nav-btn.active .done { color: #eaffea; }

  /* ===================== MAIN ===================== */
  main { max-width: 1080px; margin: 0 auto; padding: 22px 20px 80px; }
  .section { display: none; animation: fade .45s ease; }
  .section.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .kicker { color: var(--accent-2); font-weight: 700; font-size: .8rem; letter-spacing: 1.4px; text-transform: uppercase; }
  h1 { font-size: 1.95rem; line-height: 1.2; margin: 6px 0 4px; letter-spacing: -.5px; }
  h2 { font-size: 1.28rem; margin: 30px 0 8px; letter-spacing: -.2px; }
  h3 { font-size: 1.02rem; margin: 18px 0 6px; }
  p { margin: 10px 0; }
  .lead { font-size: 1.08rem; color: var(--text-soft); }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 20px 22px; box-shadow: var(--shadow); margin: 16px 0;
  }
  .callout {
    border-left: 4px solid var(--accent); background: var(--accent-soft);
    border-radius: 10px; padding: 12px 16px; margin: 16px 0;
  }
  .callout.tip { border-left-color: var(--accent-2); background: var(--accent-2-soft); }
  .callout .lbl { font-weight: 700; display: block; margin-bottom: 2px; }

  .formula {
    font-family: "Cambria Math", "Georgia", serif; text-align: center;
    font-size: 1.35rem; padding: 16px; margin: 14px 0;
    background: var(--card-2); border: 1px dashed var(--border); border-radius: 12px;
    overflow-x: auto;
  }
  .formula small { font-size: .62em; }
  var { font-style: italic; }
  .sub { vertical-align: sub; font-size: .72em; }
  .sup { vertical-align: super; font-size: .72em; }

  ul.clean { padding-left: 20px; }
  ul.clean li { margin: 6px 0; }

  /* ===================== ANIMAZIONE ===================== */
  .anim-wrap { margin: 14px 0; }
  .canvas-box {
    background: var(--card-2); border: 1px solid var(--border); border-radius: 14px;
    overflow: hidden; position: relative;
  }
  canvas { display: block; width: 100%; height: auto; touch-action: none; }
  .controls { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-top: 12px; }
  .ctrl { display: flex; flex-direction: column; gap: 4px; min-width: 190px; flex: 1; }
  .ctrl label { font-size: .8rem; color: var(--text-soft); font-weight: 600; display: flex; justify-content: space-between; }
  .ctrl label b { color: var(--accent); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; }
  .btn-ghost {
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    border-radius: 10px; padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: .85rem; transition: all .15s;
  }
  .btn-ghost:hover { border-color: var(--accent); }

  /* ===================== ESEMPIO NUMERICO ===================== */
  .example { border-top: 3px solid var(--accent-2); }
  .example .tag { display: inline-block; background: var(--accent-2-soft); color: var(--accent-2); font-weight: 700; font-size: .74rem; letter-spacing: .8px; padding: 3px 10px; border-radius: 99px; text-transform: uppercase; }
  .solution { display: none; margin-top: 10px; }
  .solution.show { display: block; animation: fade .35s; }
  .step { padding: 8px 0; border-bottom: 1px dashed var(--border); }
  .step:last-child { border-bottom: none; }
  .result-pill { display: inline-block; background: var(--good-soft); color: var(--good); font-weight: 700; padding: 6px 14px; border-radius: 10px; margin-top: 8px; }
  .mono { font-family: "SFMono-Regular", Consolas, monospace; font-size: .95em; }

  /* ===================== QUIZ ===================== */
  .quiz .qcount { font-size: .8rem; color: var(--text-soft); font-weight: 600; }
  .quiz-progress { display: flex; gap: 6px; margin: 6px 0 14px; }
  .dot { width: 26px; height: 6px; border-radius: 99px; background: var(--border); transition: background .3s; }
  .dot.done { background: var(--accent); }
  .dot.current { background: var(--accent-2); }
  .qtext { font-size: 1.08rem; font-weight: 600; margin: 6px 0 14px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    text-align: left; border: 1.5px solid var(--border); background: var(--card-2); color: var(--text);
    border-radius: 12px; padding: 13px 16px; cursor: pointer; font-size: .98rem; font-weight: 500;
    display: flex; gap: 12px; align-items: center; transition: all .16s; width: 100%;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); transform: translateX(3px); }
  .opt .key { width: 26px; height: 26px; border-radius: 8px; background: var(--card); border: 1px solid var(--border); display: grid; place-items: center; font-weight: 700; font-size: .85rem; flex: none; }
  .opt.correct { border-color: var(--good); background: var(--good-soft); }
  .opt.correct .key { background: var(--good); color: #fff; border-color: var(--good); }
  .opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
  .opt.wrong .key { background: var(--bad); color: #fff; border-color: var(--bad); }
  .opt:disabled { cursor: default; }
  .feedback { margin-top: 14px; padding: 13px 16px; border-radius: 12px; display: none; font-weight: 500; }
  .feedback.show { display: block; animation: fade .3s; }
  .feedback.ok { background: var(--good-soft); color: var(--good); }
  .feedback.no { background: var(--bad-soft); color: var(--bad); }
  .feedback .why { color: var(--text); font-weight: 400; margin-top: 4px; display: block; }
  .quiz-actions { margin-top: 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .btn-primary {
    background: var(--accent); color: #fff; border: none; border-radius: 12px;
    padding: 11px 20px; cursor: pointer; font-weight: 700; font-size: .95rem; transition: all .15s;
  }
  .btn-primary:hover { filter: brightness(1.06); transform: translateY(-1px); }
  .btn-primary:disabled { opacity: .45; cursor: not-allowed; transform: none; }
  .quiz-done { text-align: center; padding: 26px 16px; }
  .quiz-done .big { font-size: 2.6rem; }
  .quiz-done h3 { font-size: 1.3rem; margin: 8px 0 4px; }

  .section-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 34px; }
  .section-nav button { flex: 1; }
  .section-nav button:disabled { opacity: .35; cursor: not-allowed; }

  footer { text-align: center; color: var(--text-soft); font-size: .82rem; padding: 30px 20px 50px; }

  .hero-badges { display: flex; gap: 10px; flex-wrap: wrap; margin: 18px 0; }
  .hero-badges .b { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; font-size: .86rem; font-weight: 600; display: flex; align-items: center; gap: 8px; box-shadow: var(--shadow); }

  @media (max-width: 640px) {
    h1 { font-size: 1.6rem; }
    .head-inner { gap: 8px; }
    .progress-mini .lbl-txt { display: none; }
    .progress-track { width: 70px; }
    .ctrl { min-width: 140px; }
    .card { padding: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>

<header>
  <div class="head-inner">
    <div class="logo"><span class="drop">💧</span> Fluidodinamica in movimento</div>
    <div class="head-spacer"></div>

      <span class="lbl-txt">Progresso</span>

      <span id="globalPct">0%</span>

<footer>
  Realizzato per studenti del liceo · Fisica dei fluidi in moto ·

<script>
"use strict";

/* ============================================================
   PALETTE per il canvas (aggiornata al cambio tema)
   ============================================================ */
let PAL = {};
function readPalette() {
  const cs = getComputedStyle(document.body);
  const g = n => cs.getPropertyValue(n).trim();
  PAL = {
    water: g('--water'), waterDeep: g('--water-deep'), particle: g('--particle'),
    accent: g('--accent'), accent2: g('--accent-2'), text: g('--text'),
    textSoft: g('--text-soft'), card: g('--card'), card2: g('--card-2'),
    border: g('--border'), good: g('--good'), bad: g('--bad'), warn: g('--warn')
  };
}

/* ============================================================
   UTILITÀ
   ============================================================ */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const LETTERS = ['A', 'B', 'C', 'D', 'E'];

/* ============================================================
   MOTORE ANIMAZIONI  (una factory per tipo)
   Ogni factory riceve (canvas) e ritorna { start, stop, controls }
   ============================================================ */
const Animations = {};

// Helper: canvas ad alta risoluzione responsivo
function setupCanvas(canvas, aspect) {
  const parent = canvas.parentElement;
  const cssW = parent.clientWidth;
  const cssH = Math.round(cssW / aspect);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.style.height = cssH + 'px';
  canvas.width = cssW * dpr;
  canvas.height = cssH * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w: cssW, h: cssH };
}

/* ---- 1. LINEE DI CORRENTE (introduzione) ---- */
Animations.streamlines = function (canvas) {
  let raf, dims, running = false, t = 0;
  const N = 7, dots = [];
  function lineY(x, i, W, H) {
    const base = (i + 1) / (N + 1) * H;
    const amp = H * 0.10 * Math.sin((i / N) * Math.PI);
    return base + amp * Math.sin((x / W) * Math.PI * 1.4 - 0.4);
  }
  function init() {
    dots.length = 0;
    for (let i = 0; i < N; i++)
      for (let k = 0; k < 6; k++)
        dots.push({ i, x: Math.random() });
  }
  function frame() {
    if (!running) return;
    const { ctx, w, h } = dims; t += 0.016;
    ctx.clearRect(0, 0, w, h);
    for (let i = 0; i < N; i++) {
      ctx.beginPath();
      for (let px = 0; px <= w; px += 6) {
        const y = lineY(px, i, w, h);
        px === 0 ? ctx.moveTo(px, y) : ctx.lineTo(px, y);
      }
      ctx.strokeStyle = PAL.border; ctx.lineWidth = 1.4; ctx.stroke();
    }
    for (const d of dots) {
      d.x += 0.0032 + d.i * 0.0004;
      if (d.x > 1) d.x -= 1;
      const px = d.x * w, py = lineY(px, d.i, w, h);
      ctx.beginPath(); ctx.arc(px, py, 3.4, 0, 7); ctx.fillStyle = PAL.water; ctx.fill();
    }
    ctx.fillStyle = PAL.textSoft; ctx.font = '13px sans-serif';
    ctx.fillText('Le particelle seguono le linee di corrente →', 14, h - 12);
    raf = requestAnimationFrame(frame);
  }
  return {
    controls: null,
    start() { dims = setupCanvas(canvas, 2.4); if (!dots.length) init(); running = true; frame(); },
    stop() { running = false; cancelAnimationFrame(raf); },
    resize() { if (running) dims = setupCanvas(canvas, 2.4); }
  };
};

/* ---- 2. CONTINUITÀ (tubo che si restringe) ---- */
Animations.continuity = function (canvas) {
  let raf, dims, running = false;
  let narrow = 0.4; // 1 = largo come l'ingresso, 0.2 = molto stretto
  const parts = [];
  function half(x, H) {
    const wide = H * 0.34;
    const cx = 0.5, span = 0.15;
    let f;
    if (x < cx - span) f = 1;
    else if (x > cx + span) f = narrow;
    else { const u = (x - (cx - span)) / (2 * span); f = 1 + (narrow - 1) * (0.5 - 0.5 * Math.cos(u * Math.PI)); }
    return wide * f;
  }
  function speedAt(x) { // v ∝ 1/A ; A ∝ half
    const h = half(x, 1) / 0.34;
    return 0.0022 / h;
  }
  function init() {
    parts.length = 0;
    for (let k = 0; k < 90; k++) parts.push({ x: Math.random(), yr: (Math.random() * 2 - 1) * 0.86 });
  }
  function frame() {
    if (!running) return;
    const { ctx, w, h } = dims; const midY = h / 2;
    ctx.clearRect(0, 0, w, h);
    // corpo del tubo
    ctx.beginPath();
    for (let i = 0; i <= 100; i++) { const x = i / 100; const y = midY - half(x, h); (i === 0 ? ctx.moveTo : ctx.lineTo).call(ctx, x * w, y); }
    for (let i = 100; i >= 0; i--) { const x = i / 100; const y = midY + half(x, h); ctx.lineTo(x * w, y); }
    ctx.closePath();
    const grd = ctx.createLinearGradient(0, 0, 0, h);
    grd.addColorStop(0, PAL.water); grd.addColorStop(1, PAL.waterDeep);
    ctx.globalAlpha = .18; ctx.fillStyle = grd; ctx.fill(); ctx.globalAlpha = 1;
    ctx.strokeStyle = PAL.accent; ctx.lineWidth = 2.4; ctx.stroke();
    // particelle
    for (const p of parts) {
      p.x += speedAt(p.x);
      if (p.x > 1) { p.x -= 1; p.yr = (Math.random() * 2 - 1) * 0.86; }
      const hh = half(p.x, h);
      const py = midY + p.yr * hh;
      const sp = speedAt(p.x);
      const r = 2.6 + sp * 260;
      ctx.beginPath(); ctx.arc(p.x * w, py, Math.min(r, 5.5), 0, 7);
      ctx.fillStyle = PAL.particle; ctx.fill();
    }
    // etichette
    ctx.fillStyle = PAL.text; ctx.font = 'bold 13px sans-serif';
    ctx.fillText('A₁  •  v₁ piccola', 18, midY - half(0.03, h) - 10);
    ctx.textAlign = 'right';
    ctx.fillText('A₂  •  v₂ grande', w - 16, midY - half(0.97, h) - 10);
    ctx.textAlign = 'left';
    raf = requestAnimationFrame(frame);
  }
  // controlli
  const wrap = document.createElement('div');
  wrap.className = 'controls';
  wrap.innerHTML = `
    <div class="ctrl">
      <label>Restringimento della sezione A₂ <b id="c-narrow">40%</b></label>
      <input type="range" id="c-range" min="18" max="90" value="40">
    </div>
    <div class="ctrl" style="min-width:auto;flex:0">
      <label>&nbsp;</label>
      <span class="result-pill" id="c-vout">v₂ ≈ 2,5 × v₁</span>
    </div>`;
  wrap.querySelector('#c-range').addEventListener('input', e => {
    narrow = (+e.target.value) / 100;
    wrap.querySelector('#c-narrow').textContent = e.target.value + '%';
    wrap.querySelector('#c-vout').textContent = 'v₂ ≈ ' + (1 / narrow).toFixed(1).replace('.', ',') + ' × v₁';
  });
  return {
    controls: wrap,
    start() { dims = setupCanvas(canvas, 2.4); if (!parts.length) init(); running = true; frame(); },
    stop() { running = false; cancelAnimationFrame(raf); },
    resize() { if (running) dims = setupCanvas(canvas, 2.4); }
  };
};

/* ---- 3. BERNOULLI (pressione vs velocità) ---- */
Animations.bernoulli = function (canvas) {
  let raf, dims, running = false;
  let narrow = 0.42;
  const parts = [];
  function half(x, H) {
    const wide = H * 0.32, cx = 0.5, span = 0.16;
    let f;
    if (x < cx - span) f = 1; else if (x > cx + span) f = narrow;
    else { const u = (x - (cx - span)) / (2 * span); f = 1 + (narrow - 1) * (0.5 - 0.5 * Math.cos(u * Math.PI)); }
    return wide * f;
  }
  function speedAt(x) { return 0.0021 / (half(x, 1) / 0.32); }
  function pressAt(x) { return 1 - Math.pow(speedAt(x) / 0.0021, 2) * 0.62; } // 1 alta, 0 bassa (relativo)
  function init() { parts.length = 0; for (let k = 0; k < 80; k++) parts.push({ x: Math.random(), yr: (Math.random() * 2 - 1) * 0.8 }); }
  function frame() {
    if (!running) return;
    const { ctx, w, h } = dims; const midY = h * 0.56;
    ctx.clearRect(0, 0, w, h);
    // tubo
    ctx.beginPath();
    for (let i = 0; i <= 100; i++) { const x = i / 100; (i === 0 ? ctx.moveTo : ctx.lineTo).call(ctx, x * w, midY - half(x, h)); }
    for (let i = 100; i >= 0; i--) { const x = i / 100; ctx.lineTo(x * w, midY + half(x, h)); }
    ctx.closePath();
    ctx.fillStyle = PAL.card2; ctx.fill();
    ctx.strokeStyle = PAL.accent; ctx.lineWidth = 2.4; ctx.stroke();
    // tubicini di pressione (manometri) in 3 punti
    [0.15, 0.5, 0.85].forEach(x => {
      const p = pressAt(x); const topY = midY - half(x, h);
      const colH = 20 + p * (h * 0.30);
      const px = x * w;
      ctx.strokeStyle = PAL.textSoft; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(px, topY); ctx.lineTo(px, topY - colH); ctx.stroke();
      ctx.strokeStyle = p > 0.6 ? PAL.bad : PAL.accent2; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(px, topY - 2); ctx.lineTo(px, topY - colH); ctx.stroke();
      ctx.fillStyle = PAL.text; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(p > 0.6 ? 'p alta' : 'p bassa', px, topY - colH - 8);
      ctx.textAlign = 'left';
    });
    // particelle
    for (const p of parts) {
      p.x += speedAt(p.x); if (p.x > 1) { p.x -= 1; p.yr = (Math.random() * 2 - 1) * 0.8; }
      const hh = half(p.x, h); ctx.beginPath();
      ctx.arc(p.x * w, midY + p.yr * hh, 3.2, 0, 7); ctx.fillStyle = PAL.particle; ctx.fill();
    }
    ctx.fillStyle = PAL.textSoft; ctx.font = '12px sans-serif';
    ctx.fillText('Dove il fluido corre più veloce, la pressione è più bassa', 14, h - 10);
    raf = requestAnimationFrame(frame);
  }
  const wrap = document.createElement('div');
  wrap.className = 'controls';
  wrap.innerHTML = `<div class="ctrl">
    <label>Strozzatura del condotto <b id="b-narrow">42%</b></label>
    <input type="range" id="b-range" min="22" max="85" value="42"></div>`;

    narrow = (+e.target.value) / 100; wrap.querySelector('#b-narrow').textContent = e.target.value + '%';
  });
  return {
    controls: wrap,
    start() { dims = setupCanvas(canvas, 2.4); if (!parts.length) init(); running = true; frame(); },
    stop() { running = false; cancelAnimationFrame(raf); },
    resize() { if (running) dims = setupCanvas(canvas, 2.4); }
  };
};

/* ---- 4. TORRICELLI (serbatoio che si svuota) ---- */
Animations.torricelli = function (canvas) {
  let raf, dims, running = false;
  let holeDepth = 0.6; // profondità del foro (frazione dell'altezza acqua)
  const g = 9.8;
  const drops = [];
  function frame() {
    if (!running) return;
    const { ctx, w, h } = dims;
    ctx.clearRect(0, 0, w, h);
    const tankX = w * 0.10, tankW = w * 0.34, tankTop = h * 0.12, tankBot = h * 0.90;
    const tankH = tankBot - tankTop;
    const waterTop = tankTop + tankH * 0.08;
    const holeY = waterTop + (tankBot - waterTop) * holeDepth;
    const hMeters = (holeY - waterTop) / tankH * 3.2; // scala fittizia in metri
    const v = Math.sqrt(2 * g * Math.max(hMeters, 0.001));
    // serbatoio
    ctx.fillStyle = PAL.card2; ctx.fillRect(tankX, tankTop, tankW, tankH);
    // acqua
    ctx.fillStyle = PAL.water; ctx.globalAlpha = .55;
    ctx.fillRect(tankX, waterTop, tankW, tankBot - waterTop); ctx.globalAlpha = 1;
    ctx.strokeStyle = PAL.accent; ctx.lineWidth = 3;
    ctx.strokeRect(tankX, tankTop, tankW, tankH);
    // foro
    const hx = tankX + tankW;
    ctx.fillStyle = PAL.card; ctx.fillRect(hx - 4, holeY - 5, 8, 10);
    // quota h
    ctx.strokeStyle = PAL.accent2; ctx.setLineDash([5, 4]); ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(hx + 12, waterTop); ctx.lineTo(hx + 12, holeY); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = PAL.accent2; ctx.font = 'bold 13px sans-serif';
    ctx.fillText('h = ' + hMeters.toFixed(2).replace('.', ',') + ' m', hx + 18, (waterTop + holeY) / 2);
    // getto: parabola
    const vScale = 26;
    for (let s = 0; s < 60; s++) {
      const tt = s * 0.012;
      const gx = hx + v * vScale * tt;
      const gy = holeY + 0.5 * g * vScale * 6 * tt * tt;
      if (gx > w || gy > h) break;
      ctx.beginPath(); ctx.arc(gx, gy, 3, 0, 7); ctx.fillStyle = PAL.water; ctx.fill();
    }
    // gocce animate
    if (Math.random() < 0.4) drops.push({ x: hx, y: holeY, t: 0 });
    for (let i = drops.length - 1; i >= 0; i--) {
      const d = drops[i]; d.t += 0.016;
      d.x = hx + v * vScale * d.t; d.y = holeY + 0.5 * g * vScale * 6 * d.t * d.t;
      ctx.beginPath(); ctx.arc(d.x, d.y, 3.4, 0, 7); ctx.fillStyle = PAL.waterDeep; ctx.fill();
      if (d.x > w || d.y > h) drops.splice(i, 1);
    }
    ctx.fillStyle = PAL.text; ctx.font = 'bold 14px sans-serif';
    ctx.fillText('v = √(2·g·h) = ' + v.toFixed(2).replace('.', ',') + ' m/s', w * 0.52, h * 0.24);
    ctx.fillStyle = PAL.textSoft; ctx.font = '12px sans-serif';
    ctx.fillText('Più in basso è il foro, più veloce esce l\'acqua', w * 0.52, h * 0.24 + 22);
    raf = requestAnimationFrame(frame);
  }
  const wrap = document.createElement('div');
  wrap.className = 'controls';
  wrap.innerHTML = `<div class="ctrl">
    <label>Profondità del foro sotto il pelo libero <b id="t-depth">60%</b></label>
    <input type="range" id="t-range" min="10" max="96" value="60"></div>`;
  wrap.querySelector('#t-range').addEventListener('input', e => {
    holeDepth = (+e.target.value) / 100; wrap.querySelector('#t-depth').textContent = e.target.value + '%';
  });
  return {
    controls: wrap,
    start() { dims = setupCanvas(canvas, 2.2); running = true; frame(); },
    stop() { running = false; cancelAnimationFrame(raf); drops.length = 0; },
    resize() { if (running) dims = setupCanvas(canvas, 2.2); }
  };
};

/* ---- 5. REYNOLDS (laminare vs turbolento) ---- */
Animations.reynolds = function (canvas) {
  let raf, dims, running = false, t = 0;
  let Re = 800;
  const N = 5;
  function frame() {
    if (!running) return;
    const { ctx, w, h } = dims; t += 0.016;
    ctx.clearRect(0, 0, w, h);
    const pipeTop = h * 0.20, pipeBot = h * 0.80, midY = h / 2;
    // tubo
    ctx.strokeStyle = PAL.border; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, pipeTop); ctx.lineTo(w, pipeTop);
    ctx.moveTo(0, pipeBot); ctx.lineTo(w, pipeBot); ctx.stroke();
    const turb = Math.max(0, Math.min(1, (Re - 2000) / 2500));
    const speed = 0.7 + Re / 4000;
    for (let i = 0; i < N; i++) {
      const baseY = pipeTop + (pipeBot - pipeTop) * (i + 1) / (N + 1);
      ctx.beginPath();
      for (let px = 0; px <= w; px += 4) {
        const phase = px * 0.03 - t * speed * 3 + i;
        const chaos = turb * (Math.sin(phase * 2.3 + i) * 8 + Math.sin(phase * 5.1) * 6 * Math.sin(t * 3 + px));
        const y = baseY + chaos * (0.6 + 0.6 * Math.sin((px / w) * Math.PI));
        px === 0 ? ctx.moveTo(px, y) : ctx.lineTo(px, y);
      }
      ctx.strokeStyle = turb > 0.5 ? PAL.warn : PAL.water;
      ctx.lineWidth = 2.4; ctx.stroke();
    }
    // particelle guida
    for (let i = 0; i < N; i++) {
      const baseY = pipeTop + (pipeBot - pipeTop) * (i + 1) / (N + 1);
      const px = ((t * speed * 90 + i * 60) % (w + 20));
      const phase = px * 0.03 - t * speed * 3 + i;
      const chaos = turb * (Math.sin(phase * 2.3 + i) * 8 + Math.sin(phase * 5.1) * 6 * Math.sin(t * 3 + px));
      const y = baseY + chaos * (0.6 + 0.6 * Math.sin((px / w) * Math.PI));
      ctx.beginPath(); ctx.arc(px, y, 3.6, 0, 7); ctx.fillStyle = PAL.particle; ctx.fill();
    }
    const regime = Re < 2000 ? 'LAMINARE' : Re < 2500 ? 'DI TRANSIZIONE' : 'TURBOLENTO';
    ctx.fillStyle = turb > 0.5 ? PAL.warn : PAL.accent2;
    ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('Regime ' + regime, w / 2, h * 0.13);
    ctx.textAlign = 'left';
    raf = requestAnimationFrame(frame);
  }
  const wrap = document.createElement('div');
  wrap.className = 'controls';
  wrap.innerHTML = `<div class="ctrl">
    <label>Numero di Reynolds Re <b id="r-val">800</b></label>
    <input type="range" id="r-range" min="200" max="4500" step="50" value="800"></div>`;
  wrap.querySelector('#r-range').addEventListener('input', e => {
    Re = +e.target.value; wrap.querySelector('#r-val').textContent = Re;
  });
  return {
    controls: wrap,
    start() { dims = setupCanvas(canvas, 2.6); running = true; frame(); },
    stop() { running = false; cancelAnimationFrame(raf); },
    resize() { if (running) dims = setupCanvas(canvas, 2.6); }
  };
};

      <p>Misura la velocità confrontando la pressione del fluido fermo con quella del fluido in moto. È lo strumento
      che indica la velocità agli <b>aerei</b> e a molte <b>barche</b>.</p>

      <h2>Portanza dell'ala</h2>
      <p>L'aria scorre più veloce sopra l'ala che sotto: sopra la pressione è minore, sotto è maggiore, e questa
      differenza genera una spinta verso l'alto, la <b>portanza</b>. (È una spiegazione semplificata ma coglie il cuore
      del fenomeno.)</p>
      <div class="callout tip"><span class="lbl">💡 Un solo principio</span>
        Venturi, Torricelli, Pitot e portanza sembrano fenomeni diversi, ma nascono tutti da Bernoulli. Riconoscere
        lo stesso principio in situazioni diverse è esattamente ciò che significa "capire la fisica". Ci sei quasi! 🙌</div>
    `,
    anim: 'torricelli', animCaption: 'Abbassa il foro: h cresce, e con esso la velocità di uscita v = √(2gh). La gittata del getto aumenta.',
    example: {
      title: 'Il getto dal serbatoio (Torricelli)',
      body: `<p>Un serbatoio aperto contiene acqua. A <span class="mono">h = 1,8 m</span> sotto il pelo libero c'è un
        piccolo foro. <b>Con che velocità esce l'acqua?</b> (usa <span class="mono">g = 9,8 m/s²</span>)</p>`,
      steps: [
        'Applico il teorema di Torricelli: <span class="mono">v = √(2·g·h)</span>.',

        'Calcolo dentro la radice: <span class="mono">2 · 9,8 · 1,8 = 35,28</span>.',
        'Estraggo la radice: <span class="mono">v = √35,28 ≈ 5,94 m/s</span>.'
      ],
      result: 'v ≈ 5,9 m/s — nota che non dipende dalla densità né dalla larghezza del serbatoio, solo dalla profondità h. ✅'
    },
    quiz: [
      { q: 'Secondo il teorema di Torricelli, la velocità di uscita da un foro dipende...',
        opts: ['dalla profondità h del foro', 'dal colore del liquido', 'dalla larghezza del serbatoio', 'dalla temperatura dell\'aria'],
        correct: 0, why: 'v = √(2gh): conta solo la profondità h sotto il pelo libero (e g).' },
      { q: 'Il tubo di Pitot serve a misurare...',
        opts: ['la velocità di un fluido', 'la temperatura', 'la massa', 'il volume'],
        correct: 0, why: 'Confronta pressione statica e dinamica per ricavare la velocità: si usa sugli aerei.' },
      { q: 'La portanza dell\'ala nasce perché l\'aria sopra l\'ala è più veloce, quindi la pressione sopra è...',
        opts: ['minore che sotto', 'maggiore che sotto', 'uguale a sotto', 'sempre nulla'],
        correct: 0, why: 'Più velocità sopra → meno pressione sopra; la maggiore pressione sotto spinge l\'ala verso l\'alto.' },
      { q: 'Raddoppiando la profondità h del foro, la velocità di uscita...',
        opts: ['aumenta di √2 volte (circa 1,41)', 'raddoppia', 'si dimezza', 'non cambia'],
        correct: 0, why: 'v = √(2gh): la velocità va come la radice di h, quindi con h doppio cresce di un fattore √2.' }
    ]
  },

  {
    id: 'reynolds', nav: 'Viscosità e Reynolds', icon: '🌀', kicker: 'Sezione 4',
    title: 'Fluidi reali: viscosità e numero di Reynolds',
    theory: `
      <p class="lead">Fino a ora abbiamo usato il fluido ideale. Aggiungiamo l'ultimo tassello che ci avvicina alla
      realtà: l'<b>attrito interno</b> dei fluidi, cioè la <b>viscosità</b>. Ottimo lavoro fin qui: sei all'ultima tappa! 🏁</p>

      <h2>La viscosità</h2>
      <p>La <b>viscosità</b> <var>η</var> (eta) misura quanto un fluido "fa fatica" a scorrere, per via dell'attrito tra
      i suoi strati. Il miele è molto viscoso, l'acqua poco, l'aria pochissimo. La viscosità è ciò che frena davvero il fluido
      nei tubi reali.</p>

      <h2>Due modi di scorrere</h2>
      <ul class="clean">
        <li><b>Regime laminare</b>: gli strati scivolano ordinati e paralleli, come corsie di un'autostrada. Fluido calmo.</li>
        <li><b>Regime turbolento</b>: si formano vortici e mescolamenti disordinati. Fluido "agitato".</li>
      </ul>

      <h2>Il numero di Reynolds</h2>
      <p>Come prevedere quale dei due regimi avremo? Con un numero <b>puro</b> (senza unità di misura), il <b>numero di Reynolds</b>:</p>
      <div class="formula"><var>Re</var> = ( <var>ρ</var> · <var>v</var> · <var>D</var> ) / <var>η</var></div>
      <p>dove <var>D</var> è il diametro del tubo. Confronta le forze d'inerzia (che tendono al disordine) con quelle
      viscose (che tendono all'ordine). La regola pratica per un tubo:</p>
      <ul class="clean">
        <li><b>Re &lt; 2000</b> → regime <b>laminare</b> (ordinato);</li>
        <li><b>Re &gt; ~2500</b> → regime <b>turbolento</b> (vortici);</li>
        <li>in mezzo → zona di <b>transizione</b>.</li>
      </ul>
      <div class="callout"><span class="lbl">🔑 Perché è geniale</span>
        Re non ha unità di misura: lo stesso valore descrive l'acqua in un tubo, il sangue in un'arteria o l'aria attorno
        a un'ala. Muovi il cursore nell'animazione e osserva le linee passare da ordinate a caotiche.</div>
    `,

      title: 'Laminare o turbolento?',
      body: `<p>Acqua (<span class="mono">ρ = 1000 kg/m³</span>, <span class="mono">η = 1,0·10⁻³ Pa·s</span>) scorre a
        <span class="mono">v = 0,15 m/s</span> in un tubo di diametro <span class="mono">D = 2 cm = 0,02 m</span>.
        <b>Il regime è laminare o turbolento?</b></p>`,
      steps: [
        'Uso la definizione: <span class="mono">Re = ρ·v·D / η</span>.',
        'Sostituisco: <span class="mono">Re = (1000 · 0,15 · 0,02) / (1,0·10⁻³)</span>.',
        'Numeratore: <span class="mono">1000 · 0,15 · 0,02 = 3</span>.',
        'Divido: <span class="mono">Re = 3 / 0,001 = 3000</span>.',
        'Confronto con le soglie: 3000 &gt; 2500.'
      ],
      result: 'Re ≈ 3000 → regime turbolento. Basterebbe rallentare il flusso per tornare laminare. ✅'
    },
    quiz: [
      { q: 'La viscosità η di un fluido rappresenta...',
        opts: ['l\'attrito interno tra i suoi strati', 'la sua temperatura', 'la sua velocità massima', 'il suo volume'],
        correct: 0, why: 'La viscosità misura quanto il fluido resiste allo scorrimento a causa dell\'attrito interno.' },
      { q: 'Un numero di Reynolds molto basso (Re < 2000) indica un regime...',
        opts: ['laminare', 'turbolento', 'esplosivo', 'impossibile'],
        correct: 0, why: 'Con Re basso prevalgono le forze viscose, che mantengono il flusso ordinato: regime laminare.' },
      { q: 'Il numero di Reynolds Re = ρvD/η ha come unità di misura...',
        opts: ['nessuna: è un numero puro', 'm/s', 'pascal', 'kg/m³'],
        correct: 0, why: 'Tutte le unità si semplificano: Re è adimensionale, e per questo è così generale.' },
      { q: 'A parità di tutto il resto, se aumento molto la velocità v del fluido, il regime tende a diventare...',
        opts: ['turbolento', 'laminare', 'più lento', 'più freddo'],
        correct: 0, why: 'v più alta → Re più alto → prevalgono le forze d\'inerzia → turbolenza.' }
    ]
  }
];

/* ============================================================
   STATO + PERSISTENZA
   ============================================================ */
const STORE_KEY = 'fluidodinamica_progress_v1';
let progress = {};
try { progress = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { progress = {}; }
function saveProgress() { try { localStorage.setItem(STORE_KEY, JSON.stringify(progress)); } catch (e) {} }

let currentIndex = 0;
const animInstances = {}; // id -> instance
let activeAnim = null;

/* ============================================================
   COSTRUZIONE DELL'INTERFACCIA
   ============================================================ */
const navEl = document.getElementById('nav');
const mainEl = document.getElementById('main');

function buildNav() {
  navEl.innerHTML = '';
  SECTIONS.forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'nav-btn' + (i === currentIndex ? ' active' : '');
    const done = progress[s.id] ? '<span class="done">✓</span>' : '';
    b.innerHTML = `<span>${s.icon}</span> ${s.nav} ${done}`;
    b.addEventListener('click', () => goTo(i));
    navEl.appendChild(b);
  });
}

function buildSection(s, i) {
  const sec = document.createElement('section');
  sec.className = 'section' + (i === currentIndex ? ' active' : '');
  sec.id = 'sec-' + s.id;

  // Teoria
  const head = `<div class="kicker">${s.kicker}</div><h1>${s.title}</h1>`;
  const theory = `<div class="theory">${s.theory}</div>`;

  // Animazione
  const animBlock = `
    <div class="anim-wrap card">
      <h3>🎬 Animazione — muovi i cursori e osserva</h3>
      <div class="canvas-box"><canvas id="cv-${s.id}"></canvas></div>
      <div id="ctrl-${s.id}"></div>
      <p style="color:var(--text-soft);font-size:.86rem;margin-top:10px">${s.animCaption}</p>
    </div>`;

  // Esempio numerico
  const ex = s.example;
  const stepsHtml = ex.steps ? ex.steps.map(st => `<div class="step">▸ ${st}</div>`).join('') : '';
  const exampleBlock = `
    <div class="card example">
      <span class="tag">🔢 Esempio numerico</span>
      <h3 style="margin-top:10px">${ex.title}</h3>
      ${ex.body}
      <button class="btn-ghost" id="sol-btn-${s.id}">Mostra la soluzione passo passo</button>
      <div class="solution" id="sol-${s.id}">
        ${stepsHtml}
        <div class="result-pill">✔ ${ex.result}</div>
      </div>
    </div>`;

  // Quiz
  const quizBlock = `
    <div class="card quiz" id="quiz-${s.id}">
      <h2 style="margin-top:0">🎯 Quiz della sezione</h2>
      <div class="qcount">Rispondi per fissare i concetti. Puoi ripetere il quiz quando vuoi.</div>
      <div id="quizbody-${s.id}"></div>
    </div>`;

  // Navigazione tra sezioni
  const navBtns = `
    <div class="section-nav">
      <button class="btn-ghost" id="prev-${s.id}" ${i === 0 ? 'disabled' : ''}>← Sezione precedente</button>
      <button class="btn-primary" id="next-${s.id}" ${i === SECTIONS.length - 1 ? 'disabled' : ''}>Prossima sezione →</button>
    </div>`;

  sec.innerHTML = head + theory + animBlock + exampleBlock + quizBlock + navBtns;
  mainEl.appendChild(sec);

  // wiring: soluzione
  sec.querySelector('#sol-btn-' + s.id).addEventListener('click', e => {
    const sol = sec.querySelector('#sol-' + s.id);
    sol.classList.toggle('show');
    e.target.textContent = sol.classList.contains('show') ? 'Nascondi la soluzione' : 'Mostra la soluzione passo passo';
  });
  // wiring: navigazione
  sec.querySelector('#prev-' + s.id).addEventListener('click', () => goTo(i - 1));
  sec.querySelector('#next-' + s.id).addEventListener('click', () => goTo(i + 1));

  // wiring: animazione + controlli
  const canvas = sec.querySelector('#cv-' + s.id);
  const inst = Animations[s.anim](canvas);
  animInstances[s.id] = inst;
  if (inst.controls) sec.querySelector('#ctrl-' + s.id).appendChild(inst.controls);

  // quiz
  renderQuiz(s);
}

/* ============================================================
   QUIZ (una domanda alla volta, opzioni mescolate)
   ============================================================ */
const quizState = {}; // id -> { order:[...], idx, correctCount, answered }

function renderQuiz(s) {
  const body = document.getElementById('quizbody-' + s.id);
  quizState[s.id] = { order: shuffle(s.quiz.map((_, k) => k)), idx: 0, correctCount: 0 };
  showQuestion(s);
}

function showQuestion(s) {
  const st = quizState[s.id];
  const body = document.getElementById('quizbody-' + s.id);
  const total = s.quiz.length;

  if (st.idx >= total) { showQuizDone(s); return; }

  const qi = st.order[st.idx];
  const question = s.quiz[qi];
  // opzioni con posizione casuale
  const optOrder = shuffle(question.opts.map((_, k) => k));

  const dots = s.quiz.map((_, k) =>
    `<div class="dot ${k < st.idx ? 'done' : k === st.idx ? 'current' : ''}"></div>`).join('');

  body.innerHTML = `
    <div class="quiz-progress">${dots}</div>
    <div class="qcount">Domanda ${st.idx + 1} di ${total}</div>
    <div class="qtext">${question.q}</div>
    <div class="options" id="opts-${s.id}"></div>
    <div class="feedback" id="fb-${s.id}"></div>
    <div class="quiz-actions">
      <button class="btn-primary" id="nextq-${s.id}" disabled>Continua →</button>
    </div>`;

  const optsEl = body.querySelector('#opts-' + s.id);
  optOrder.forEach((origIdx, pos) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="key">${LETTERS[pos]}</span><span>${question.opts[origIdx]}</span>`;
    btn.addEventListener('click', () => answer(s, btn, origIdx, question, optsEl));
    optsEl.appendChild(btn);
  });
}

function answer(s, btn, origIdx, question, optsEl) {
  const st = quizState[s.id];
  const fb = document.getElementById('fb-' + s.id);
  const nextBtn = document.getElementById('nextq-' + s.id);
  const isRight = origIdx === question.correct;

  // disabilita tutte, evidenzia
  [...optsEl.children].forEach(b => {
    b.disabled = true;
    const label = b.querySelector('span:last-child').textContent;
    if (label === question.opts[question.correct]) b.classList.add('correct');
  });
  if (!isRight) btn.classList.add('wrong');

  if (isRight) {
    st.correctCount++;
    fb.className = 'feedback ok show';
    fb.innerHTML = `✅ <b>Esatto!</b> <span class="why">${question.why}</span>`;
  } else {
    fb.className = 'feedback no show';
    fb.innerHTML = `Non proprio, ma è così che si impara. 🌱 <span class="why">${question.why}</span>`;
  }
  nextBtn.disabled = false;
  nextBtn.onclick = () => { st.idx++; showQuestion(s); };
}

function showQuizDone(s) {
  const st = quizState[s.id];
  const body = document.getElementById('quizbody-' + s.id);
  const total = s.quiz.length;
  const score = st.correctCount;
  const perfect = score === total;

  // segna la sezione come completata (se almeno provata fino in fondo)
  progress[s.id] = true; saveProgress(); buildNav(); updateGlobal();

  let msg, emoji;
  if (perfect) { emoji = '🏆'; msg = 'Perfetto, tutte corrette! Hai padroneggiato questa sezione.'; }
  else if (score >= total - 1) { emoji = '🌟'; msg = 'Ottimo lavoro! Ci sei quasi al 100%.'; }
  else if (score >= total / 2) { emoji = '👍'; msg = 'Bel risultato! Rileggi la teoria dei punti incerti e riprova: migliorerai di sicuro.'; }
  else { emoji = '🌱'; msg = 'Ogni errore è un passo avanti. Rivedi con calma la teoria e riprova: andrà meglio!'; }

  body.innerHTML = `
    <div class="quiz-done">
      <div class="big">${emoji}</div>
      <h3>${score} / ${total} corrette</h3>
      <p style="color:var(--text-soft);max-width:460px;margin:6px auto 18px">${msg}</p>
      <button class="btn-primary" id="retry-${s.id}">↻ Rifai il quiz</button>
      ${currentIndex < SECTIONS.length - 1 ? `<button class="btn-ghost" id="go-next-${s.id}" style="margin-left:8px">Vai alla prossima sezione →</button>` : ''}
    </div>`;
  body.querySelector('#retry-' + s.id).addEventListener('click', () => renderQuiz(s));
  const gn = body.querySelector('#go-next-' + s.id);
  if (gn) gn.addEventListener('click', () => goTo(currentIndex + 1));
}

/* ============================================================
   NAVIGAZIONE + PROGRESSO GLOBALE
   ============================================================ */
function goTo(i) {
  if (i < 0 || i >= SECTIONS.length) return;
  // ferma animazione corrente
  if (activeAnim) activeAnim.stop();
  currentIndex = i;
  document.querySelectorAll('.section').forEach((el, k) => el.classList.toggle('active', k === i));
  buildNav();
  // avvia animazione della nuova sezione
  const s = SECTIONS[i];
  activeAnim = animInstances[s.id];
  requestAnimationFrame(() => { activeAnim.resize(); activeAnim.start(); });
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updateGlobal() {
  const done = SECTIONS.filter(s => progress[s.id]).length;
  const pct = Math.round(done / SECTIONS.length * 100);
  document.getElementById('globalFill').style.width = pct + '%';
  document.getElementById('globalPct').textContent = pct + '%';
}

/* ============================================================
   TEMA GIORNO / NOTTE
   ============================================================ */
const themeBtn = document.getElementById('themeBtn');
const themeLbl = document.getElementById('themeLbl');
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  themeBtn.firstChild.textContent = theme === 'dark' ? '☀️ ' : '🌙 ';
  themeLbl.textContent = theme === 'dark' ? 'Giorno' : 'Notte';
  readPalette();
  try { localStorage.setItem('fluidodinamica_theme', theme); } catch (e) {}
}
themeBtn.addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(cur);
});

/* ============================================================
   AVVIO
   ============================================================ */
function init() {
  // tema iniziale: salvato o preferenza di sistema
  let theme = 'light';
  try { theme = localStorage.getItem('fluidodinamica_theme'); } catch (e) {}
  if (!theme) theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  applyTheme(theme);

  SECTIONS.forEach((s, i) => buildSection(s, i));
  buildNav();
  updateGlobal();

  // avvia l'animazione della prima sezione
  activeAnim = animInstances[SECTIONS[0].id];
  requestAnimationFrame(() => { activeAnim.resize(); activeAnim.start(); });
}

// ridimensionamento
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (activeAnim) activeAnim.resize(); }, 180);
});

init();
</script>
