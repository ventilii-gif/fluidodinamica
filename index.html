<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Fluidodinamica per il liceo: teoria, animazioni, esempi numerici e quiz. Percorso interattivo per studenti di 17 anni.">
<title>Fluidodinamica — Impara i fluidi in moto</title>
<style>
  /* ===================== TEMA E VARIABILI ===================== */
  :root {
    --bg: #eef3f8;
    --bg-grad-1: #e3edf7;
    --bg-grad-2: #eef3f8;
    --card: #ffffff;
    --card-2: #f6f9fc;
    --text: #16202b;
    --text-soft: #52606d;
    --accent: #1565c0;
    --accent-soft: #e3f0fc;
    --accent-2: #00897b;
    --accent-2-soft: #d8f2ee;
    --border: #dbe4ee;
    --shadow: 0 6px 22px rgba(21, 45, 80, .09);
    --good: #2e7d32;
    --good-soft: #e6f4ea;
    --bad: #c62828;
    --bad-soft: #fbe7e7;
    --warn: #ef6c00;
    --water: #2196f3;
    --water-deep: #0d47a1;
    --particle: #0d47a1;
  }
  [data-theme="dark"] {
    --bg: #0d1620;
    --bg-grad-1: #101d2b;
    --bg-grad-2: #0b131c;
    --card: #16232f;
    --card-2: #1b2a38;
    --text: #e7eef5;
    --text-soft: #9fb1c1;
    --accent: #4fc3f7;
    --accent-soft: #123244;
    --accent-2: #4db6ac;
    --accent-2-soft: #10322e;
    --border: #26394a;
    --shadow: 0 6px 24px rgba(0, 0, 0, .38);
    --good: #66bb6a;
    --good-soft: #17321d;
    --bad: #ef5350;
    --bad-soft: #37191a;
    --warn: #ffa726;
    --water: #4fc3f7;
    --water-deep: #0288d1;
    --particle: #b3e5fc;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    background:
      radial-gradient(1100px 700px at 82% -8%, var(--bg-grad-1), transparent 60%),
      var(--bg);
    line-height: 1.62;
    transition: background .4s ease, color .3s ease;
    -webkit-font-smoothing: antialiased;
  }

  /* ===================== HEADER ===================== */
  header {
    position: sticky; top: 0; z-index: 50;
    backdrop-filter: blur(10px);
    background: color-mix(in srgb, var(--card) 86%, transparent);
    border-bottom: 1px solid var(--border);
  }
  .head-inner {
    max-width: 1080px; margin: 0 auto; padding: 12px 20px;
    display: flex; align-items: center; gap: 14px;
  }
  .logo {
    display: flex; align-items: center; gap: 11px; font-weight: 800;
    font-size: 1.08rem; letter-spacing: .2px; white-space: nowrap;
  }
  .logo .drop { font-size: 1.5rem; }
  .head-spacer { flex: 1; }
  .progress-mini { display: flex; align-items: center; gap: 9px; font-size: .82rem; color: var(--text-soft); }
  .progress-track { width: 120px; height: 8px; border-radius: 99px; background: var(--card-2); overflow: hidden; border: 1px solid var(--border); }
  .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .5s cubic-bezier(.2,.8,.2,1); }
  .theme-btn {
    border: 1px solid var(--border); background: var(--card-2); color: var(--text);
    border-radius: 99px; padding: 8px 14px; cursor: pointer; font-size: .88rem; font-weight: 600;
    display: flex; align-items: center; gap: 7px; transition: transform .15s, background .3s;
  }
  .theme-btn:hover { transform: translateY(-1px); }
  .theme-btn:active { transform: translateY(0); }

  /* ===================== NAV ===================== */
  nav {
    max-width: 1080px; margin: 14px auto 0; padding: 0 20px;
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .nav-btn {
    border: 1px solid var(--border); background: var(--card); color: var(--text-soft);
    border-radius: 99px; padding: 8px 14px; cursor: pointer; font-size: .86rem; font-weight: 600;
    display: flex; align-items: center; gap: 7px; transition: all .18s;
  }
  .nav-btn:hover { border-color: var(--accent); color: var(--text); }
  .nav-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: var(--shadow); }
  .nav-btn .num { font-size: .72rem; opacity: .8; }
  .nav-btn .done { color: var(--good); }
  .nav-btn.active .done { color: #eaffea; }

  /* ===================== MAIN ===================== */
  main { max-width: 1080px; margin: 0 auto; padding: 22px 20px 80px; }
  .section { display: none; animation: fade .45s ease; }
  .section.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .kicker { color: var(--accent-2); font-weight: 700; font-size: .8rem; letter-spacing: 1.4px; text-transform: uppercase; }
  h1 { font-size: 1.95rem; line-height: 1.2; margin: 6px 0 4px; letter-spacing: -.5px; }
  h2 { font-size: 1.28rem; margin: 30px 0 8px; letter-spacing: -.2px; }
  h3 { font-size: 1.02rem; margin: 18px 0 6px; }
  p { margin: 10px 0; }
  .lead { font-size: 1.08rem; color: var(--text-soft); }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 20px 22px; box-shadow: var(--shadow); margin: 16px 0;
  }
  .callout {
    border-left: 4px solid var(--accent); background: var(--accent-soft);
    border-radius: 10px; padding: 12px 16px; margin: 16px 0;
  }
  .callout.tip { border-left-color: var(--accent-2); background: var(--accent-2-soft); }
  .callout .lbl { font-weight: 700; display: block; margin-bottom: 2px; }

  .formula {
    font-family: "Cambria Math", "Georgia", serif; text-align: center;
    font-size: 1.35rem; padding: 16px; margin: 14px 0;
    background: var(--card-2); border: 1px dashed var(--border); border-radius: 12px;
    overflow-x: auto;
  }
  .formula small { font-size: .62em; }
  var { font-style: italic; }
  .sub { vertical-align: sub; font-size: .72em; }
  .sup { vertical-align: super; font-size: .72em; }

  ul.clean { padding-left: 20px; }
  ul.clean li { margin: 6px 0; }

  dl.gloss { margin: 10px 0; }
  dl.gloss dt { font-weight: 700; color: var(--accent); margin-top: 14px; }
  dl.gloss dd { margin: 3px 0 0; padding-left: 0; color: var(--text-soft); }
  dl.gloss dd .mono, dl.gloss dd var { color: var(--text); }

  /* ===================== ANIMAZIONE ===================== */
  .anim-wrap { margin: 14px 0; }
  .canvas-box {
    background: var(--card-2); border: 1px solid var(--border); border-radius: 14px;
    overflow: hidden; position: relative;
  }
  canvas { display: block; width: 100%; height: auto; touch-action: none; }
  .controls { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-top: 12px; }
  .ctrl { display: flex; flex-direction: column; gap: 4px; min-width: 190px; flex: 1; }
  .ctrl label { font-size: .8rem; color: var(--text-soft); font-weight: 600; display: flex; justify-content: space-between; }
  .ctrl label b { color: var(--accent); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; }
  .btn-ghost {
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    border-radius: 10px; padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: .85rem; transition: all .15s;
  }
  .btn-ghost:hover { border-color: var(--accent); }

  /* ===================== ESEMPIO NUMERICO ===================== */
  .example { border-top: 3px solid var(--accent-2); }
  .example .tag { display: inline-block; background: var(--accent-2-soft); color: var(--accent-2); font-weight: 700; font-size: .74rem; letter-spacing: .8px; padding: 3px 10px; border-radius: 99px; text-transform: uppercase; }
  .solution { display: none; margin-top: 10px; }
  .solution.show { display: block; animation: fade .35s; }
  .step { padding: 8px 0; border-bottom: 1px dashed var(--border); }
  .step:last-child { border-bottom: none; }
  .result-pill { display: inline-block; background: var(--good-soft); color: var(--good); font-weight: 700; padding: 6px 14px; border-radius: 10px; margin-top: 8px; }
  .mono { font-family: "SFMono-Regular", Consolas, monospace; font-size: .95em; }

  /* ===================== QUIZ ===================== */
  .quiz .qcount { font-size: .8rem; color: var(--text-soft); font-weight: 600; }
  .quiz-progress { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 14px; }
  .qcat { display: inline-block; font-size: .72rem; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; padding: 3px 10px; border-radius: 99px; margin-bottom: 8px; }
  .qcat.teo { background: var(--accent-soft); color: var(--accent); }
  .qcat.num { background: var(--accent-2-soft); color: var(--accent-2); }
  .dot { width: 26px; height: 6px; border-radius: 99px; background: var(--border); transition: background .3s; }
  .dot.done { background: var(--accent); }
  .dot.current { background: var(--accent-2); }
  .qtext { font-size: 1.08rem; font-weight: 600; margin: 6px 0 14px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    text-align: left; border: 1.5px solid var(--border); background: var(--card-2); color: var(--text);
    border-radius: 12px; padding: 13px 16px; cursor: pointer; font-size: .98rem; font-weight: 500;
    display: flex; gap: 12px; align-items: center; transition: all .16s; width: 100%;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); transform: translateX(3px); }
  .opt .key { width: 26px; height: 26px; border-radius: 8px; background: var(--card); border: 1px solid var(--border); display: grid; place-items: center; font-weight: 700; font-size: .85rem; flex: none; }
  .opt.correct { border-color: var(--good); background: var(--good-soft); }
  .opt.correct .key { background: var(--good); color: #fff; border-color: var(--good); }
  .opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
  .opt.wrong .key { background: var(--bad); color: #fff; border-color: var(--bad); }
  .opt:disabled { cursor: default; }
  .opt.sel { border-color: var(--accent); background: var(--accent-soft); }
  .opt.sel .key { background: var(--accent); color: #fff; border-color: var(--accent); }
  .fq-review { margin-top: 20px; }
  .fq-review h3 { margin: 0 0 8px; font-size: 1.05rem; }
  .fq-item { border-top: 1px dashed var(--border); padding: 12px 0; }
  .fq-item .fq-q { font-weight: 600; margin-bottom: 4px; }
  .fq-item .fq-line { font-size: .9rem; margin: 2px 0; }
  .fq-ok { color: var(--good); font-weight: 700; }
  .fq-no { color: var(--bad); font-weight: 700; }
  .fq-item .fq-why { color: var(--text-soft); font-size: .88rem; margin-top: 4px; }
  .feedback { margin-top: 14px; padding: 13px 16px; border-radius: 12px; display: none; font-weight: 500; }
  .feedback.show { display: block; animation: fade .3s; }
  .feedback.ok { background: var(--good-soft); color: var(--good); }
  .feedback.no { background: var(--bad-soft); color: var(--bad); }
  .feedback .why { color: var(--text); font-weight: 400; margin-top: 4px; display: block; }
  .quiz-actions { margin-top: 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .btn-primary {
    background: var(--accent); color: #fff; border: none; border-radius: 12px;
    padding: 11px 20px; cursor: pointer; font-weight: 700; font-size: .95rem; transition: all .15s;
  }
  .btn-primary:hover { filter: brightness(1.06); transform: translateY(-1px); }
  .btn-primary:disabled { opacity: .45; cursor: not-allowed; transform: none; }
  .quiz-done { text-align: center; padding: 26px 16px; }
  .quiz-done .big { font-size: 2.6rem; }
  .quiz-done h3 { font-size: 1.3rem; margin: 8px 0 4px; }

  /* ===================== RISOLUTORE ===================== */
  .solver .picker { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 8px; }
  .solver .picker .ctrl { flex: 1; min-width: 220px; }
  .solver select, .solver input[type=text] {
    width: 100%; padding: 10px 12px; border: 1.5px solid var(--border);
    border-radius: 10px; background: var(--card-2); color: var(--text);
    font-size: .95rem; font-family: inherit;
  }
  .solver select:focus, .solver input[type=text]:focus { outline: none; border-color: var(--accent); }
  .solver .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; margin: 14px 0; }
  .solver .field label { font-size: .82rem; color: var(--text-soft); font-weight: 600; display: block; margin-bottom: 4px; }
  .solver .field .u { color: var(--accent); font-weight: 700; }
  .solver .field input:disabled { opacity: .4; }
  .solver .formula-hint {
    font-family: "Cambria Math", Georgia, serif; text-align: center; font-size: 1.08rem;
    padding: 10px; background: var(--card-2); border: 1px dashed var(--border); border-radius: 10px; margin: 6px 0 4px;
  }
  .method-box { margin-top: 16px; }
  .method-box h4 { margin: 0 0 6px; font-size: .95rem; color: var(--accent-2); }
  .solver-err { color: var(--bad); font-weight: 600; margin-top: 12px; background: var(--bad-soft); padding: 10px 14px; border-radius: 10px; }

  /* ===================== SOTTO-SCHEDE (moduli) ===================== */
  .subtabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 18px 0 4px; border-bottom: 2px solid var(--border); }
  .subtab {
    border: none; background: transparent; color: var(--text-soft); font-weight: 700; font-size: .92rem;
    padding: 10px 15px; cursor: pointer; border-radius: 10px 10px 0 0; border-bottom: 3px solid transparent;
    margin-bottom: -2px; transition: all .15s;
  }
  .subtab:hover { color: var(--text); background: var(--card-2); }
  .subtab.active { color: var(--accent); border-bottom-color: var(--accent); background: var(--accent-soft); }
  .subpanel { display: none; animation: fade .35s ease; }
  .subpanel.active { display: block; }
  .subpanel .anim-wrap:first-child, .subpanel .card:first-child { margin-top: 16px; }

  /* ===================== SUGGERIMENTI PROGRESSIVI ===================== */
  .hint { background: var(--accent-2-soft); border-left: 3px solid var(--accent-2); border-radius: 8px; padding: 10px 14px; margin: 8px 0; animation: fade .3s; }
  .eser-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .eser-verify { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 14px 0 2px; padding: 12px 14px; background: var(--card-2); border: 1px solid var(--border); border-radius: 12px; }
  .eser-verify label { font-size: .85rem; font-weight: 600; color: var(--text-soft); }
  .eser-verify label .u { color: var(--accent); font-weight: 700; }
  .eser-verify input { flex: 0 1 150px; padding: 8px 12px; border: 1.5px solid var(--border); border-radius: 10px; background: var(--card); color: var(--text); font-size: .95rem; font-family: inherit; }
  .eser-verify input:focus { outline: none; border-color: var(--accent); }
  .eser-verify .feedback { flex-basis: 100%; margin-top: 4px; }

  /* ===================== TIMELINE STORICA ===================== */
  .timeline { display: flex; flex-direction: column; gap: 10px; margin: 16px 0; }
  .tl-item { display: flex; gap: 14px; background: var(--card-2); border: 1px solid var(--border); border-radius: 12px; padding: 12px 15px; }
  .tl-year { flex: none; min-width: 88px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
  @media (max-width: 560px) {
    .tl-item { flex-direction: column; gap: 3px; }
    .tl-year { min-width: auto; }
  }

  .section-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 34px; }
  .section-nav button { flex: 1; }
  .section-nav button:disabled { opacity: .35; cursor: not-allowed; }

  footer { text-align: center; color: var(--text-soft); font-size: .82rem; padding: 30px 20px 50px; }


  @media (max-width: 640px) {
    h1 { font-size: 1.6rem; }
    .head-inner { gap: 8px; }
    .progress-mini .lbl-txt { display: none; }
    .progress-track { width: 70px; }
    .ctrl { min-width: 140px; }
    .card { padding: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>

  <div class="head-inner">
    <div class="logo"><span class="drop">💧</span> Fluidodinamica</div>

      <span class="lbl-txt">Progresso</span>

<script>
"use strict";

/* ============================================================
   PALETTE per il canvas (aggiornata al cambio tema)
   ============================================================ */
let PAL = {};
function readPalette() {
  const cs = getComputedStyle(document.body);
  const g = n => cs.getPropertyValue(n).trim();
  PAL = {
    water: g('--water'), waterDeep: g('--water-deep'), particle: g('--particle'),
    accent: g('--accent'), accent2: g('--accent-2'), text: g('--text'),
    textSoft: g('--text-soft'), card: g('--card'), card2: g('--card-2'),
    border: g('--border'), good: g('--good'), bad: g('--bad'), warn: g('--warn')
  };
}

/* ============================================================
   UTILITÀ
   ============================================================ */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const LETTERS = ['A', 'B', 'C', 'D', 'E'];

/* ============================================================
   MOTORE ANIMAZIONI  (una factory per tipo)
   Ogni factory riceve (canvas) e ritorna { start, stop, controls }
   ============================================================ */
const Animations = {};

// Helper: canvas ad alta risoluzione responsivo
function setupCanvas(canvas, aspect) {
  const parent = canvas.parentElement;
  const cssW = parent.clientWidth;
  const cssH = Math.round(cssW / aspect);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.style.height = cssH + 'px';
  canvas.width = cssW * dpr;
  canvas.height = cssH * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w: cssW, h: cssH };
}

/* ---- 1. LINEE DI CORRENTE (introduzione) ---- */
Animations.streamlines = function (canvas) {
  let raf, dims, running = false, t = 0;
  const N = 7, dots = [];
  function lineY(x, i, W, H) {
    const base = (i + 1) / (N + 1) * H;
    const amp = H * 0.10 * Math.sin((i / N) * Math.PI);
    return base + amp * Math.sin((x / W) * Math.PI * 1.4 - 0.4);
  }
  function init() {
    dots.length = 0;
    for (let i = 0; i < N; i++)
      for (let k = 0; k < 6; k++)
        dots.push({ i, x: Math.random() });
  }
  function frame() {
    if (!running) return;
    const { ctx, w, h } = dims; t += 0.016;
    ctx.clearRect(0, 0, w, h);
    for (let i = 0; i < N; i++) {
      ctx.beginPath();
      for (let px = 0; px <= w; px += 6) {
        const y = lineY(px, i, w, h);
        px === 0 ? ctx.moveTo(px, y) : ctx.lineTo(px, y);
      }
      ctx.strokeStyle = PAL.border; ctx.lineWidth = 1.4; ctx.stroke();
    }
    for (const d of dots) {
      d.x += 0.0032 + d.i * 0.0004;
      if (d.x > 1) d.x -= 1;
      const px = d.x * w, py = lineY(px, d.i, w, h);
      ctx.beginPath(); ctx.arc(px, py, 3.4, 0, 7); ctx.fillStyle = PAL.water; ctx.fill();
    }
    ctx.fillStyle = PAL.textSoft; ctx.font = '13px sans-serif';
    ctx.fillText('Le particelle seguono le linee di corrente →', 14, h - 12);
    raf = requestAnimationFrame(frame);
  }
  return {
    controls: null,
    start() { dims = setupCanvas(canvas, 2.4); if (!dots.length) init(); running = true; frame(); },
    stop() { running = false; cancelAnimationFrame(raf); },
    resize() { if (running) dims = setupCanvas(canvas, 2.4); }
  };
};

/* ---- 1b. FLUIDOSTATICA (Archimede + pressione con la profondità) ---- */
Animations.hydrostatics = function (canvas) {
  let raf, dims, running = false, t = 0;
  let rhoObj = 500; // densità dell'oggetto (kg/m³); acqua = 1000
  const rhoW = 1000, g = 9.8;
  function frame() {
    if (!running) return;
    const { ctx, w, h } = dims; t += 0.016;
    ctx.clearRect(0, 0, w, h);
    const tankX = w * 0.06, tankW = w * 0.52, tankTop = h * 0.14, tankBot = h * 0.92;
    const surface = tankTop + (tankBot - tankTop) * 0.14;
    // acqua
    ctx.fillStyle = PAL.water; ctx.globalAlpha = .5;
    ctx.fillRect(tankX, surface, tankW, tankBot - surface); ctx.globalAlpha = 1;
    ctx.strokeStyle = PAL.accent; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(tankX, tankTop); ctx.lineTo(tankX, tankBot);
    ctx.lineTo(tankX + tankW, tankBot); ctx.lineTo(tankX + tankW, tankTop); ctx.stroke();
    // frecce di pressione lungo la parete (Stevino: cresce con la profondità)
    const arrX = tankX + tankW - 4;
    for (let k = 1; k <= 5; k++) {
      const y = surface + (tankBot - surface) * k / 6;
      const len = 8 + (y - surface) / (tankBot - surface) * 34;
      ctx.strokeStyle = PAL.accent2; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(arrX, y); ctx.lineTo(arrX - len, y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(arrX - len, y); ctx.lineTo(arrX - len + 6, y - 4);
      ctx.lineTo(arrX - len + 6, y + 4); ctx.closePath(); ctx.fillStyle = PAL.accent2; ctx.fill();
    }
    // oggetto: frazione immersa = rhoObj/rhoW (se <1 galleggia), altrimenti affonda
    const boxW = tankW * 0.30, boxH = (tankBot - surface) * 0.34;
    const boxX = tankX + tankW * 0.16;
    const floats = rhoObj < rhoW;
    const frac = floats ? rhoObj / rhoW : 1;
    let boxTop;
    if (floats) boxTop = surface - boxH * (1 - frac) + Math.sin(t * 1.6) * 3;
    else boxTop = tankBot - boxH - 4;
    ctx.fillStyle = floats ? PAL.accent2 : PAL.warn;
    ctx.globalAlpha = .92; ctx.fillRect(boxX, boxTop, boxW, boxH); ctx.globalAlpha = 1;
    ctx.strokeStyle = PAL.text; ctx.lineWidth = 1.5; ctx.strokeRect(boxX, boxTop, boxW, boxH);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(rhoObj + ' kg/m³', boxX + boxW / 2, boxTop + boxH / 2 + 4);
    ctx.textAlign = 'left';
    // testo di stato
    ctx.fillStyle = PAL.text; ctx.font = 'bold 15px sans-serif';
    ctx.fillText(floats ? '⬆ Galleggia' : '⬇ Affonda', w * 0.64, h * 0.30);
    ctx.fillStyle = PAL.textSoft; ctx.font = '12.5px sans-serif';
    const lines = floats
      ? ['ρ oggetto < ρ acqua', 'Frazione immersa ≈ ' + Math.round(frac * 100) + '%', '(spinta = peso: equilibrio)']
      : ['ρ oggetto > ρ acqua', 'Il peso vince sulla', 'spinta di Archimede'];
    lines.forEach((L, i) => ctx.fillText(L, w * 0.64, h * 0.30 + 24 + i * 20));
    ctx.fillStyle = PAL.accent2; ctx.font = '12px sans-serif';
    ctx.fillText('→ la pressione cresce con la profondità', w * 0.64, h * 0.86);
    raf = requestAnimationFrame(frame);
  }
  const wrap = document.createElement('div');
  wrap.className = 'controls';
  wrap.innerHTML = `<div class="ctrl">
    <label>Densità dell'oggetto (acqua = 1000 kg/m³) <b id="hy-val">500 kg/m³</b></label>
    <input type="range" id="hy-range" min="200" max="1400" step="20" value="500"></div>`;
  wrap.querySelector('#hy-range').addEventListener('input', e => {
    rhoObj = +e.target.value; wrap.querySelector('#hy-val').textContent = rhoObj + ' kg/m³';
  });
  return {
    controls: wrap,
    start() { dims = setupCanvas(canvas, 2.2); running = true; frame(); },
    stop() { running = false; cancelAnimationFrame(raf); },
    resize() { if (running) dims = setupCanvas(canvas, 2.2); }
  };
};

/* ---- 1c. TORCHIO IDRAULICO (principio di Pascal) ---- */
Animations.hydraulicPress = function (canvas) {
  let raf, dims, running = false, t = 0;
  let F1 = 50, ratio = 5;
  function arrow(ctx, x, y1, y2, col) {
    ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x, y1); ctx.lineTo(x, y2); ctx.stroke();
    const dir = y2 > y1 ? 1 : -1;
    ctx.beginPath(); ctx.moveTo(x, y2); ctx.lineTo(x - 5, y2 - dir * 9); ctx.lineTo(x + 5, y2 - dir * 9); ctx.closePath(); ctx.fill();
  }
  function frame() {
    if (!running) return;
    const { ctx, w, h } = dims; t += 0.016;
    ctx.clearRect(0, 0, w, h);
    const F2 = F1 * ratio;
    const pump = (Math.sin(t * 1.6) + 1) / 2;
    const yTop = h * 0.30, floorY = h * 0.80, chH = h * 0.10;
    const smallW = w * 0.07, bigW = smallW * ratio;
    const smallX = w * 0.10, bigX = Math.min(w * 0.55, w * 0.95 - bigW);
    // fluido nel contenitore a U
    ctx.fillStyle = PAL.water; ctx.globalAlpha = .45;
    ctx.fillRect(smallX, yTop + h * 0.16, smallW, floorY - (yTop + h * 0.16));
    ctx.fillRect(bigX, yTop + h * 0.10, bigW, floorY - (yTop + h * 0.10));
    ctx.fillRect(smallX, floorY, (bigX + bigW) - smallX, chH);
    ctx.globalAlpha = 1;
    // pareti dei cilindri
    ctx.strokeStyle = PAL.accent; ctx.lineWidth = 2.5;
    ctx.strokeRect(smallX, yTop, smallW, floorY + chH - yTop);
    ctx.strokeRect(bigX, yTop, bigW, floorY + chH - yTop);
    // pistoni: il piccolo scende, il grande sale di 1/ratio
    const smallPistonY = yTop + h * 0.16 + pump * h * 0.10;
    const bigPistonY = yTop + h * 0.10 - (pump * h * 0.10) / ratio;
    ctx.fillStyle = PAL.textSoft;
    ctx.fillRect(smallX, smallPistonY, smallW, 10);
    ctx.fillRect(bigX, bigPistonY, bigW, 10);
    // carico sul pistone grande
    ctx.fillStyle = PAL.accent2;
    const loadW = bigW * 0.72, loadH = h * 0.13;
    ctx.fillRect(bigX + (bigW - loadW) / 2, bigPistonY - loadH, loadW, loadH);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('carico', bigX + bigW / 2, bigPistonY - loadH / 2 + 4);
    // frecce delle forze
    arrow(ctx, smallX + smallW / 2, yTop + h * 0.02, smallPistonY - 4, PAL.bad);
    arrow(ctx, bigX + bigW / 2, bigPistonY - loadH - 4, bigPistonY - loadH - h * 0.10, PAL.good);
    // etichette
    ctx.fillStyle = PAL.text; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('F₁ = ' + pnum(F1) + ' N', smallX + smallW / 2, yTop - 8);
    ctx.fillText('F₂ = ' + pnum(F2) + ' N', bigX + bigW / 2, yTop - 8);
    ctx.fillStyle = PAL.accent2; ctx.font = '12.5px sans-serif';
    ctx.fillText('F₂ = F₁ · (A₂/A₁) = ' + pnum(F1) + ' · ' + ratio + ' = ' + pnum(F2) + ' N', w / 2, h * 0.98);
    ctx.textAlign = 'left';
    raf = requestAnimationFrame(frame);
  }
  const wrap = document.createElement('div');
  wrap.className = 'controls';
  wrap.innerHTML = `
    <div class="ctrl">
      <label>Forza applicata F₁ <b id="hp-f">50 N</b></label>
      <input type="range" id="hp-frange" min="10" max="200" step="5" value="50">
    </div>
    <div class="ctrl">
      <label>Rapporto delle aree A₂/A₁ <b id="hp-r">5×</b></label>
      <input type="range" id="hp-rrange" min="2" max="6" step="1" value="5">
    </div>`;
  wrap.querySelector('#hp-frange').addEventListener('input', e => { F1 = +e.target.value; wrap.querySelector('#hp-f').textContent = F1 + ' N'; });
  wrap.querySelector('#hp-rrange').addEventListener('input', e => { ratio = +e.target.value; wrap.querySelector('#hp-r').textContent = ratio + '×'; });
  return {
    controls: wrap,
    start() { dims = setupCanvas(canvas, 2.1); running = true; frame(); },
    stop() { running = false; cancelAnimationFrame(raf); },
    resize() { if (running) dims = setupCanvas(canvas, 2.1); }
  };
};

/* ---- 1d. TUBO AD U (due fluidi immiscibili) ---- */
Animations.utube = function (canvas) {
  let raf, dims, running = false;
  const rho1 = 1000;
  let rho2 = 800;
  function frame() {
    if (!running) return;
    const { ctx, w, h } = dims;
    ctx.clearRect(0, 0, w, h);
    const armW = w * 0.11, gap = w * 0.14;
    const leftX = w * 0.30, rightX = leftX + gap + armW;
    const topY = h * 0.16, botY = h * 0.86;
    const h1 = h * 0.42;
    let h2 = h1 * rho1 / rho2;
    const maxH = botY - topY - 4;
    const sc = h2 > maxH ? maxH / h2 : 1;
    const H1 = h1 * sc, H2 = h2 * sc;
    // contorno del tubo a U
    ctx.strokeStyle = PAL.border; ctx.lineWidth = 3;
    ctx.strokeRect(leftX, topY, armW, botY - topY);
    ctx.strokeRect(rightX, topY, armW, botY - topY);
    ctx.beginPath(); ctx.moveTo(leftX, botY); ctx.lineTo(rightX + armW, botY); ctx.stroke();
    // fluidi
    ctx.fillStyle = PAL.water; ctx.globalAlpha = .55; ctx.fillRect(leftX + 1, botY - H1, armW - 2, H1); ctx.globalAlpha = 1;
    ctx.fillStyle = PAL.warn; ctx.globalAlpha = .55; ctx.fillRect(rightX + 1, botY - H2, armW - 2, H2); ctx.globalAlpha = 1;
    // livelli
    ctx.strokeStyle = PAL.accent; ctx.setLineDash([5, 4]); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(leftX - 10, botY - H1); ctx.lineTo(leftX + armW + 6, botY - H1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(rightX - 6, botY - H2); ctx.lineTo(rightX + armW + 10, botY - H2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = PAL.text; ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'right'; ctx.fillText('h₁', leftX - 12, botY - H1 / 2);
    ctx.textAlign = 'left'; ctx.fillText('h₂', rightX + armW + 12, botY - H2 / 2);
    // densità
    ctx.textAlign = 'center'; ctx.font = '12px sans-serif';
    ctx.fillStyle = PAL.accent; ctx.fillText('ρ₁ = ' + rho1, leftX + armW / 2, botY - H1 - 8);
    ctx.fillStyle = PAL.warn; ctx.fillText('ρ₂ = ' + rho2, rightX + armW / 2, botY - H2 - 8);
    // relazione
    ctx.fillStyle = PAL.text; ctx.font = 'bold 14px sans-serif';
    ctx.fillText('All\'interfaccia: ρ₁·h₁ = ρ₂·h₂', w / 2, h * 0.09);
    ctx.textAlign = 'left';
    raf = requestAnimationFrame(frame);
  }
  const wrap = document.createElement('div');
  wrap.className = 'controls';
  wrap.innerHTML = `<div class="ctrl">
    <label>Densità del fluido di destra ρ₂ (a sinistra acqua = 1000 kg/m³) <b id="ut-r">800 kg/m³</b></label>
    <input type="range" id="ut-range" min="400" max="1600" step="20" value="800"></div>`;
  wrap.querySelector('#ut-range').addEventListener('input', e => { rho2 = +e.target.value; wrap.querySelector('#ut-r').textContent = rho2 + ' kg/m³'; });
  return {
    controls: wrap,
    start() { dims = setupCanvas(canvas, 2.0); running = true; frame(); },
    stop() { running = false; cancelAnimationFrame(raf); },
    resize() { if (running) dims = setupCanvas(canvas, 2.0); }
  };
};

/* ---- 2. CONTINUITÀ (tubo che si restringe) ---- */
Animations.continuity = function (canvas) {
  let raf, dims, running = false;
  let narrow = 0.4; // 1 = largo come l'ingresso, 0.2 = molto stretto
  const parts = [];
  function half(x, H) {
    const wide = H * 0.34;
    const cx = 0.5, span = 0.15;
    let f;
    if (x < cx - span) f = 1;
    else if (x > cx + span) f = narrow;
    else { const u = (x - (cx - span)) / (2 * span); f = 1 + (narrow - 1) * (0.5 - 0.5 * Math.cos(u * Math.PI)); }
    return wide * f;
  }
  function speedAt(x) { // v ∝ 1/A ; A ∝ half
    const h = half(x, 1) / 0.34;
    return 0.0022 / h;
  }
  function init() {
    parts.length = 0;
    for (let k = 0; k < 90; k++) parts.push({ x: Math.random(), yr: (Math.random() * 2 - 1) * 0.86 });
  }
  function frame() {
    if (!running) return;
    const { ctx, w, h } = dims; const midY = h / 2;
    ctx.clearRect(0, 0, w, h);
    // corpo del tubo
    ctx.beginPath();
    for (let i = 0; i <= 100; i++) { const x = i / 100; const y = midY - half(x, h); (i === 0 ? ctx.moveTo : ctx.lineTo).call(ctx, x * w, y); }
    for (let i = 100; i >= 0; i--) { const x = i / 100; const y = midY + half(x, h); ctx.lineTo(x * w, y); }
    ctx.closePath();
    const grd = ctx.createLinearGradient(0, 0, 0, h);
    grd.addColorStop(0, PAL.water); grd.addColorStop(1, PAL.waterDeep);
    ctx.globalAlpha = .18; ctx.fillStyle = grd; ctx.fill(); ctx.globalAlpha = 1;
    ctx.strokeStyle = PAL.accent; ctx.lineWidth = 2.4; ctx.stroke();
    // particelle
    for (const p of parts) {
      p.x += speedAt(p.x);
      if (p.x > 1) { p.x -= 1; p.yr = (Math.random() * 2 - 1) * 0.86; }
      const hh = half(p.x, h);
      const py = midY + p.yr * hh;
      const sp = speedAt(p.x);
      const r = 2.6 + sp * 260;
      ctx.beginPath(); ctx.arc(p.x * w, py, Math.min(r, 5.5), 0, 7);
      ctx.fillStyle = PAL.particle; ctx.fill();
    }
    // etichette
    ctx.fillStyle = PAL.text; ctx.font = 'bold 13px sans-serif';
    ctx.fillText('A₁  •  v₁ piccola', 18, midY - half(0.03, h) - 10);
    ctx.textAlign = 'right';
    ctx.fillText('A₂  •  v₂ grande', w - 16, midY - half(0.97, h) - 10);
    ctx.textAlign = 'left';
    raf = requestAnimationFrame(frame);
  }
  // controlli
  const wrap = document.createElement('div');
  wrap.className = 'controls';
  wrap.innerHTML = `
    <div class="ctrl">
      <label>Restringimento della sezione A₂ <b id="c-narrow">40%</b></label>
      <input type="range" id="c-range" min="18" max="90" value="40">
    </div>
    <div class="ctrl" style="min-width:auto;flex:0">
      <label>&nbsp;</label>
      <span class="result-pill" id="c-vout">v₂ ≈ 2,5 × v₁</span>
    </div>`;
  wrap.querySelector('#c-range').addEventListener('input', e => {
    narrow = (+e.target.value) / 100;
    wrap.querySelector('#c-narrow').textContent = e.target.value + '%';
    wrap.querySelector('#c-vout').textContent = 'v₂ ≈ ' + (1 / narrow).toFixed(1).replace('.', ',') + ' × v₁';
  });
  return {
    controls: wrap,
    start() { dims = setupCanvas(canvas, 2.4); if (!parts.length) init(); running = true; frame(); },
    stop() { running = false; cancelAnimationFrame(raf); },
    resize() { if (running) dims = setupCanvas(canvas, 2.4); }
  };
};

/* ---- 3. BERNOULLI (pressione vs velocità) ---- */
Animations.bernoulli = function (canvas) {
  let raf, dims, running = false;
  let narrow = 0.42;
  const parts = [];
  function half(x, H) {
    const wide = H * 0.32, cx = 0.5, span = 0.16;
    let f;
    if (x < cx - span) f = 1; else if (x > cx + span) f = narrow;
    else { const u = (x - (cx - span)) / (2 * span); f = 1 + (narrow - 1) * (0.5 - 0.5 * Math.cos(u * Math.PI)); }
    return wide * f;
  }
  function speedAt(x) { return 0.0021 / (half(x, 1) / 0.32); }
  function pressAt(x) { return 1 - Math.pow(speedAt(x) / 0.0021, 2) * 0.62; } // 1 alta, 0 bassa (relativo)
  function init() { parts.length = 0; for (let k = 0; k < 80; k++) parts.push({ x: Math.random(), yr: (Math.random() * 2 - 1) * 0.8 }); }
  function frame() {
    if (!running) return;
    const { ctx, w, h } = dims; const midY = h * 0.56;
    ctx.clearRect(0, 0, w, h);
    // tubo
    ctx.beginPath();
    for (let i = 0; i <= 100; i++) { const x = i / 100; (i === 0 ? ctx.moveTo : ctx.lineTo).call(ctx, x * w, midY - half(x, h)); }
    for (let i = 100; i >= 0; i--) { const x = i / 100; ctx.lineTo(x * w, midY + half(x, h)); }
    ctx.closePath();
    ctx.fillStyle = PAL.card2; ctx.fill();
    ctx.strokeStyle = PAL.accent; ctx.lineWidth = 2.4; ctx.stroke();
    // tubicini di pressione (manometri) in 3 punti
    [0.15, 0.5, 0.85].forEach(x => {
      const p = pressAt(x); const topY = midY - half(x, h);
      const colH = 20 + p * (h * 0.30);
      const px = x * w;
      ctx.strokeStyle = PAL.textSoft; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(px, topY); ctx.lineTo(px, topY - colH); ctx.stroke();
      ctx.strokeStyle = p > 0.6 ? PAL.bad : PAL.accent2; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(px, topY - 2); ctx.lineTo(px, topY - colH); ctx.stroke();
      ctx.fillStyle = PAL.text; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(p > 0.6 ? 'p alta' : 'p bassa', px, topY - colH - 8);
      ctx.textAlign = 'left';
    });
    // particelle
    for (const p of parts) {
      p.x += speedAt(p.x); if (p.x > 1) { p.x -= 1; p.yr = (Math.random() * 2 - 1) * 0.8; }
      const hh = half(p.x, h); ctx.beginPath();
      ctx.arc(p.x * w, midY + p.yr * hh, 3.2, 0, 7); ctx.fillStyle = PAL.particle; ctx.fill();
    }
    ctx.fillStyle = PAL.textSoft; ctx.font = '12px sans-serif';
    ctx.fillText('Dove il fluido corre più veloce, la pressione è più bassa', 14, h - 10);
    raf = requestAnimationFrame(frame);
  }
  const wrap = document.createElement('div');
  wrap.className = 'controls';
  wrap.innerHTML = `<div class="ctrl">
    <label>Strozzatura del condotto <b id="b-narrow">42%</b></label>
    <input type="range" id="b-range" min="22" max="85" value="42"></div>`;
  wrap.querySelector('#b-range').addEventListener('input', e => {
    narrow = (+e.target.value) / 100; wrap.querySelector('#b-narrow').textContent = e.target.value + '%';
  });
  return {
    controls: wrap,
    start() { dims = setupCanvas(canvas, 2.4); if (!parts.length) init(); running = true; frame(); },
    stop() { running = false; cancelAnimationFrame(raf); },
    resize() { if (running) dims = setupCanvas(canvas, 2.4); }
  };
};

/* ---- 4. TORRICELLI (serbatoio che si svuota) ---- */
Animations.torricelli = function (canvas) {
  let raf, dims, running = false;
  let holeDepth = 0.6; // profondità del foro (frazione dell'altezza acqua)
  const g = 9.8;
  const drops = [];
  function frame() {
    if (!running) return;
    const { ctx, w, h } = dims;
    ctx.clearRect(0, 0, w, h);
    const tankX = w * 0.10, tankW = w * 0.34, tankTop = h * 0.12, tankBot = h * 0.90;
    const tankH = tankBot - tankTop;
    const waterTop = tankTop + tankH * 0.08;
    const holeY = waterTop + (tankBot - waterTop) * holeDepth;
    const hMeters = (holeY - waterTop) / tankH * 3.2; // scala fittizia in metri
    const v = Math.sqrt(2 * g * Math.max(hMeters, 0.001));
    // serbatoio
    ctx.fillStyle = PAL.card2; ctx.fillRect(tankX, tankTop, tankW, tankH);
    // acqua
    ctx.fillStyle = PAL.water; ctx.globalAlpha = .55;
    ctx.fillRect(tankX, waterTop, tankW, tankBot - waterTop); ctx.globalAlpha = 1;
    ctx.strokeStyle = PAL.accent; ctx.lineWidth = 3;
    ctx.strokeRect(tankX, tankTop, tankW, tankH);
    // foro
    const hx = tankX + tankW;
    ctx.fillStyle = PAL.card; ctx.fillRect(hx - 4, holeY - 5, 8, 10);
    // quota h
    ctx.strokeStyle = PAL.accent2; ctx.setLineDash([5, 4]); ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(hx + 12, waterTop); ctx.lineTo(hx + 12, holeY); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = PAL.accent2; ctx.font = 'bold 13px sans-serif';
    ctx.fillText('h = ' + hMeters.toFixed(2).replace('.', ',') + ' m', hx + 18, (waterTop + holeY) / 2);
    // getto: parabola
    const vScale = 26;
    for (let s = 0; s < 60; s++) {
      const tt = s * 0.012;
      const gx = hx + v * vScale * tt;
      const gy = holeY + 0.5 * g * vScale * 6 * tt * tt;
      if (gx > w || gy > h) break;
      ctx.beginPath(); ctx.arc(gx, gy, 3, 0, 7); ctx.fillStyle = PAL.water; ctx.fill();
    }
    // gocce animate
    if (Math.random() < 0.4) drops.push({ x: hx, y: holeY, t: 0 });
    for (let i = drops.length - 1; i >= 0; i--) {
      const d = drops[i]; d.t += 0.016;
      d.x = hx + v * vScale * d.t; d.y = holeY + 0.5 * g * vScale * 6 * d.t * d.t;
      ctx.beginPath(); ctx.arc(d.x, d.y, 3.4, 0, 7); ctx.fillStyle = PAL.waterDeep; ctx.fill();
      if (d.x > w || d.y > h) drops.splice(i, 1);
    }
    ctx.fillStyle = PAL.text; ctx.font = 'bold 14px sans-serif';
    ctx.fillText('v = √(2·g·h) = ' + v.toFixed(2).replace('.', ',') + ' m/s', w * 0.52, h * 0.24);
    ctx.fillStyle = PAL.textSoft; ctx.font = '12px sans-serif';
    ctx.fillText('Più in basso è il foro, più veloce esce l\'acqua', w * 0.52, h * 0.24 + 22);
    raf = requestAnimationFrame(frame);
  }
  const wrap = document.createElement('div');
  wrap.className = 'controls';
  wrap.innerHTML = `<div class="ctrl">
    <label>Profondità del foro sotto il pelo libero <b id="t-depth">60%</b></label>
    <input type="range" id="t-range" min="10" max="96" value="60"></div>`;
  wrap.querySelector('#t-range').addEventListener('input', e => {
    holeDepth = (+e.target.value) / 100; wrap.querySelector('#t-depth').textContent = e.target.value + '%';
  });
  return {
    controls: wrap,
    start() { dims = setupCanvas(canvas, 2.2); running = true; frame(); },
    stop() { running = false; cancelAnimationFrame(raf); drops.length = 0; },
    resize() { if (running) dims = setupCanvas(canvas, 2.2); }
  };
};

/* ---- 5. REYNOLDS (laminare vs turbolento) ---- */
Animations.reynolds = function (canvas) {
  let raf, dims, running = false, t = 0;
  let Re = 800;
  const N = 5;
  function frame() {
    if (!running) return;
    const { ctx, w, h } = dims; t += 0.016;
    ctx.clearRect(0, 0, w, h);
    const pipeTop = h * 0.20, pipeBot = h * 0.80, midY = h / 2;
    // tubo
    ctx.strokeStyle = PAL.border; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, pipeTop); ctx.lineTo(w, pipeTop);
    ctx.moveTo(0, pipeBot); ctx.lineTo(w, pipeBot); ctx.stroke();
    const turb = Math.max(0, Math.min(1, (Re - 2000) / 2500));
    const speed = 0.7 + Re / 4000;
    for (let i = 0; i < N; i++) {
      const baseY = pipeTop + (pipeBot - pipeTop) * (i + 1) / (N + 1);
      ctx.beginPath();
      for (let px = 0; px <= w; px += 4) {
        const phase = px * 0.03 - t * speed * 3 + i;
        const chaos = turb * (Math.sin(phase * 2.3 + i) * 8 + Math.sin(phase * 5.1) * 6 * Math.sin(t * 3 + px));
        const y = baseY + chaos * (0.6 + 0.6 * Math.sin((px / w) * Math.PI));
        px === 0 ? ctx.moveTo(px, y) : ctx.lineTo(px, y);
      }
      ctx.strokeStyle = turb > 0.5 ? PAL.warn : PAL.water;
      ctx.lineWidth = 2.4; ctx.stroke();
    }
    // particelle guida
    for (let i = 0; i < N; i++) {
      const baseY = pipeTop + (pipeBot - pipeTop) * (i + 1) / (N + 1);
      const px = ((t * speed * 90 + i * 60) % (w + 20));
      const phase = px * 0.03 - t * speed * 3 + i;
      const chaos = turb * (Math.sin(phase * 2.3 + i) * 8 + Math.sin(phase * 5.1) * 6 * Math.sin(t * 3 + px));
      const y = baseY + chaos * (0.6 + 0.6 * Math.sin((px / w) * Math.PI));
      ctx.beginPath(); ctx.arc(px, y, 3.6, 0, 7); ctx.fillStyle = PAL.particle; ctx.fill();
    }
    const regime = Re < 2000 ? 'LAMINARE' : Re < 2500 ? 'DI TRANSIZIONE' : 'TURBOLENTO';
    ctx.fillStyle = turb > 0.5 ? PAL.warn : PAL.accent2;
    ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('Regime ' + regime, w / 2, h * 0.13);
    ctx.textAlign = 'left';
    raf = requestAnimationFrame(frame);
  }
  const wrap = document.createElement('div');
  wrap.className = 'controls';
  wrap.innerHTML = `<div class="ctrl">
    <label>Numero di Reynolds Re <b id="r-val">800</b></label>
    <input type="range" id="r-range" min="200" max="4500" step="50" value="800"></div>`;
  wrap.querySelector('#r-range').addEventListener('input', e => {
    Re = +e.target.value; wrap.querySelector('#r-val').textContent = Re;
  });
  return {
    controls: wrap,
    start() { dims = setupCanvas(canvas, 2.6); running = true; frame(); },
    stop() { running = false; cancelAnimationFrame(raf); },
    resize() { if (running) dims = setupCanvas(canvas, 2.6); }
  };
};

/* ---- 3b. PORTANZA DELL'ALA (Bernoulli) ---- */
Animations.airfoil = function (canvas) {
  let raf, dims, running = false, t = 0, spd = 1;
  const dots = [];
  function wingY(x, cx, chord, cyc, thick) { // profilo dell'ala: metà spessore superiore/inferiore
    const u = (x - (cx - chord / 2)) / chord; // 0..1
    if (u < 0 || u > 1) return null;
    const camber = Math.sin(u * Math.PI);
    return { top: cyc - thick * camber, bot: cyc + thick * 0.35 * camber };
  }
  function init() { dots.length = 0; for (let i = 0; i < 90; i++) dots.push({ x: Math.random(), lane: Math.floor(Math.random() * 7) }); }
  function frame() {
    if (!running) return;
    const { ctx, w, h } = dims; t += 0.016;
    ctx.clearRect(0, 0, w, h);
    const cx = w * 0.5, chord = w * 0.44, cyc = h * 0.56, thick = h * 0.14;
    // ala
    ctx.beginPath();
    for (let px = cx - chord / 2; px <= cx + chord / 2; px += 4) { const y = wingY(px, cx, chord, cyc, thick); if (y) (px === cx - chord / 2 ? ctx.moveTo : ctx.lineTo).call(ctx, px, y.top); }
    for (let px = cx + chord / 2; px >= cx - chord / 2; px -= 4) { const y = wingY(px, cx, chord, cyc, thick); if (y) ctx.lineTo(px, y.bot); }
    ctx.closePath(); ctx.fillStyle = PAL.textSoft; ctx.fill();
    // linee di corrente (7 corsie)
    const lanes = [-3, -2, -1, 0, 1, 2, 3];
    lanes.forEach((k) => {
      const baseY = cyc + k * (thick * 0.9);
      ctx.beginPath();
      for (let px = 0; px <= w; px += 6) {
        const near = Math.exp(-Math.pow((px - cx) / (chord * 0.55), 2));
        const bend = (k <= 0 ? -1 : 1) * near * thick * (k <= 0 ? 1.0 : 0.4);
        const y = baseY + bend;
        px === 0 ? ctx.moveTo(px, y) : ctx.lineTo(px, y);
      }
      ctx.strokeStyle = PAL.border; ctx.lineWidth = 1.3; ctx.stroke();
    });
    // pallini (più veloci sopra l'ala)
    for (const d of dots) {
      const k = lanes[d.lane];
      const fast = k <= 0 ? 1.7 : 1.0;
      d.x += (0.0026 * spd) * fast;
      if (d.x > 1) { d.x -= 1; }
      const px = d.x * w;
      const near = Math.exp(-Math.pow((px - cx) / (chord * 0.55), 2));
      const bend = (k <= 0 ? -1 : 1) * near * thick * (k <= 0 ? 1.0 : 0.4);
      const py = cyc + k * (thick * 0.9) + bend;
      ctx.beginPath(); ctx.arc(px, py, 3, 0, 7); ctx.fillStyle = k <= 0 ? PAL.accent : PAL.water; ctx.fill();
    }
    // freccia portanza
    ctx.strokeStyle = PAL.good; ctx.fillStyle = PAL.good; ctx.lineWidth = 3;
    const lift = 30 + spd * 26;
    ctx.beginPath(); ctx.moveTo(cx, cyc - thick - 6); ctx.lineTo(cx, cyc - thick - 6 - lift); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, cyc - thick - 6 - lift); ctx.lineTo(cx - 6, cyc - thick - 6 - lift + 11); ctx.lineTo(cx + 6, cyc - thick - 6 - lift + 11); ctx.closePath(); ctx.fill();
    ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('PORTANZA', cx + 62, cyc - thick - lift + 4);
    ctx.fillStyle = PAL.accent; ctx.font = '12px sans-serif';
    ctx.fillText('sopra: aria più veloce → pressione minore', cx, h * 0.12);
    ctx.fillStyle = PAL.textSoft;
    ctx.fillText('sotto: aria più lenta → pressione maggiore', cx, h * 0.95);
    ctx.textAlign = 'left';
    raf = requestAnimationFrame(frame);
  }
  const wrap = document.createElement('div');
  wrap.className = 'controls';
  wrap.innerHTML = `<div class="ctrl">
    <label>Velocità dell'aria <b id="af-v">bassa</b></label>
    <input type="range" id="af-range" min="1" max="3" step="1" value="1"></div>`;
  wrap.querySelector('#af-range').addEventListener('input', e => { spd = +e.target.value; wrap.querySelector('#af-v').textContent = spd === 1 ? 'bassa' : spd === 2 ? 'media' : 'alta'; });
  return {
    controls: wrap,
    start() { dims = setupCanvas(canvas, 2.4); if (!dots.length) init(); running = true; frame(); },
    stop() { running = false; cancelAnimationFrame(raf); },
    resize() { if (running) dims = setupCanvas(canvas, 2.4); }
  };
};

/* ---- 4b. EFFETTO VENTURI con aspirazione (Applicazioni) ---- */
Animations.venturi = function (canvas) {
  let raf, dims, running = false; let flow = 0.6;
  const parts = [];
  function half(x, H) {
    const wide = H * 0.26, cx = 0.5, span = 0.13, narrow = 0.4;
    let f; if (x < cx - span) f = 1; else if (x > cx + span) f = 1; else { const u = (x - (cx - span)) / (2 * span); f = 1 + (narrow - 1) * Math.sin(u * Math.PI); }
    return wide * f;
  }
  function speedAt(x) { return (0.0016 + flow * 0.0030) / (half(x, 1) / (1 * 0.26)); }
  function init() { parts.length = 0; for (let k = 0; k < 70; k++) parts.push({ x: Math.random(), yr: (Math.random() * 2 - 1) * 0.8 }); }
  function frame() {
    if (!running) return;
    const { ctx, w, h } = dims; const midY = h * 0.42;
    ctx.clearRect(0, 0, w, h);
    // condotto
    ctx.beginPath();
    for (let i = 0; i <= 100; i++) { const x = i / 100; (i === 0 ? ctx.moveTo : ctx.lineTo).call(ctx, x * w, midY - half(x, h)); }
    for (let i = 100; i >= 0; i--) { const x = i / 100; ctx.lineTo(x * w, midY + half(x, h)); }
    ctx.closePath(); ctx.fillStyle = PAL.card2; ctx.fill();
    ctx.strokeStyle = PAL.accent; ctx.lineWidth = 2.4; ctx.stroke();
    // pallini
    for (const p of parts) { p.x += speedAt(p.x); if (p.x > 1) { p.x -= 1; p.yr = (Math.random() * 2 - 1) * 0.8; } const hh = half(p.x, h); ctx.beginPath(); ctx.arc(p.x * w, midY + p.yr * hh, 3, 0, 7); ctx.fillStyle = PAL.particle; ctx.fill(); }
    // tubicino di aspirazione nella strozzatura
    const throatX = 0.5 * w, throatBot = midY + half(0.5, h);
    const resY = h * 0.90, resTop = h * 0.72;
    ctx.strokeStyle = PAL.textSoft; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(throatX, throatBot); ctx.lineTo(throatX, resY); ctx.stroke();
    // serbatoio di liquido in basso
    ctx.fillStyle = PAL.water; ctx.globalAlpha = .5; ctx.fillRect(w * 0.36, resTop, w * 0.28, resY - resTop); ctx.globalAlpha = 1;
    ctx.strokeStyle = PAL.accent2; ctx.lineWidth = 2; ctx.strokeRect(w * 0.36, resTop, w * 0.28, resY - resTop);
    // colonna che sale nel tubicino ∝ depressione (∝ flow²)
    const rise = (throatBot < resTop ? 0 : (resY - throatBot)) * Math.min(1, flow * flow * 1.4);
    ctx.strokeStyle = PAL.water; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(throatX, resY); ctx.lineTo(throatX, resY - rise); ctx.stroke();
    // etichette
    ctx.fillStyle = PAL.text; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('strozzatura: v alta, p bassa', throatX, midY - half(0.5, h) - 10);
    ctx.fillStyle = PAL.accent2; ctx.font = '12px sans-serif';
    ctx.fillText('la depressione aspira il liquido ↑', throatX, resY + h * 0.06);
    ctx.textAlign = 'left';
    raf = requestAnimationFrame(frame);
  }
  const wrap = document.createElement('div');
  wrap.className = 'controls';
  wrap.innerHTML = `<div class="ctrl">
    <label>Velocità del flusso principale <b id="ve-v">media</b></label>
    <input type="range" id="ve-range" min="20" max="100" step="5" value="60"></div>`;
  wrap.querySelector('#ve-range').addEventListener('input', e => { flow = (+e.target.value) / 100; wrap.querySelector('#ve-v').textContent = flow < 0.45 ? 'bassa' : flow < 0.75 ? 'media' : 'alta'; });
  return {
    controls: wrap,
    start() { dims = setupCanvas(canvas, 2.2); if (!parts.length) init(); running = true; frame(); },
    stop() { running = false; cancelAnimationFrame(raf); },
    resize() { if (running) dims = setupCanvas(canvas, 2.2); }
  };
};

/* ---- 5b. PROFILO DI VELOCITÀ (Reynolds) ---- */
Animations.velprofile = function (canvas) {
  let raf, dims, running = false, t = 0, Re = 800;
  const N = 11, parts = [];
  function prof(yr) { // yr in [-1,1] → fattore di velocità [0..1]
    const turb = Math.max(0, Math.min(1, (Re - 2000) / 2500));
    const lam = 1 - yr * yr;
    const plug = Math.pow(Math.max(0, 1 - Math.abs(yr)), 0.16);
    return (1 - turb) * lam + turb * plug;
  }
  function init() { parts.length = 0; for (let i = 0; i < N; i++) for (let k = 0; k < 5; k++) parts.push({ yr: -1 + 2 * (i + 0.5) / N, x: Math.random() }); }
  function frame() {
    if (!running) return;
    const { ctx, w, h } = dims; t += 0.016;
    ctx.clearRect(0, 0, w, h);
    const pipeTop = h * 0.20, pipeBot = h * 0.80, midY = (pipeTop + pipeBot) / 2, R = (pipeBot - pipeTop) / 2;
    // pareti
    ctx.strokeStyle = PAL.border; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, pipeTop); ctx.lineTo(w, pipeTop); ctx.moveTo(0, pipeBot); ctx.lineTo(w, pipeBot); ctx.stroke();
    // profilo (frecce) a sinistra
    const x0 = w * 0.10, scale = w * 0.30;
    ctx.strokeStyle = PAL.accent2; ctx.fillStyle = PAL.accent2; ctx.lineWidth = 2;
    for (let i = 0; i <= N; i++) {
      const yr = -1 + 2 * i / N; const y = midY + yr * R; const len = prof(yr) * scale;
      ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x0 + len, y); ctx.stroke();
      if (len > 8) { ctx.beginPath(); ctx.moveTo(x0 + len, y); ctx.lineTo(x0 + len - 7, y - 3.5); ctx.lineTo(x0 + len - 7, y + 3.5); ctx.closePath(); ctx.fill(); }
    }
    // curva inviluppo del profilo
    ctx.strokeStyle = PAL.accent; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i <= 40; i++) { const yr = -1 + 2 * i / 40; const y = midY + yr * R; const len = prof(yr) * scale; (i === 0 ? ctx.moveTo : ctx.lineTo).call(ctx, x0 + len, y); }
    ctx.stroke();
    // pallini che scorrono a destra con velocità locale
    for (const p of parts) { p.x += 0.002 + prof(p.yr) * 0.010 * (0.6 + Re / 4000); if (p.x > 1) p.x -= 1; const px = x0 + scale + 20 + p.x * (w - x0 - scale - 30); const py = midY + p.yr * R; ctx.beginPath(); ctx.arc(px, py, 2.8, 0, 7); ctx.fillStyle = PAL.particle; ctx.fill(); }
    const turb = Re >= 2500;
    ctx.fillStyle = turb ? PAL.warn : PAL.accent2; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(turb ? 'Profilo TURBOLENTO (più piatto)' : 'Profilo LAMINARE (parabolico)', w / 2, h * 0.13);
    ctx.textAlign = 'left';
    raf = requestAnimationFrame(frame);
  }
  const wrap = document.createElement('div');
  wrap.className = 'controls';
  wrap.innerHTML = `<div class="ctrl">
    <label>Numero di Reynolds Re <b id="vp-val">800</b></label>
    <input type="range" id="vp-range" min="200" max="4500" step="50" value="800"></div>`;
  wrap.querySelector('#vp-range').addEventListener('input', e => { Re = +e.target.value; wrap.querySelector('#vp-val').textContent = Re; });
  return {
    controls: wrap,
    start() { dims = setupCanvas(canvas, 2.6); if (!parts.length) init(); running = true; frame(); },
    stop() { running = false; cancelAnimationFrame(raf); },
    resize() { if (running) dims = setupCanvas(canvas, 2.6); }
  };
};

      <p class="lead">Hai completato il percorso: complimenti! 🎉 Tieni qui a portata di mano tutte le definizioni e

      <h2>Grandezze e simboli</h2>
      <dl class="gloss">
        <dt>Fluido</dt><dd>Sostanza che scorre e prende la forma del recipiente: liquido o gas.</dd>
        <dt>Fluido ideale</dt><dd>Modello semplificato: incomprimibile, non viscoso, in regime stazionario.</dd>
        <dt>Densità (<var>ρ</var>)</dt><dd>Massa per unità di volume, in kg/m³. Acqua ≈ 1000 kg/m³.</dd>
        <dt>Pressione (<var>p</var>)</dt><dd>Forza per unità di superficie: <span class="mono">p = F/A</span>, in pascal (Pa).</dd>
        <dt>Portata (<var>Q</var>)</dt><dd>Volume di fluido che attraversa una sezione al secondo: <span class="mono">Q = A·v</span>, in m³/s.</dd>
        <dt>Viscosità (<var>η</var>)</dt><dd>Attrito interno del fluido: quanto "fa fatica" a scorrere. Alta nel miele, bassa nell'aria.</dd>
        <dt>Numero di Reynolds (<var>Re</var>)</dt><dd>Numero puro (senza unità) che distingue regime laminare da turbolento.</dd>
      </dl>

      <h2>Leggi e principi</h2>
      <dl class="gloss">
        <dt>Legge di Stevino</dt><dd><span class="mono">p = p₀ + ρgh</span> — la pressione in un liquido cresce con la profondità <var>h</var>.</dd>
        <dt>Principio di Pascal</dt><dd>Una pressione applicata a un fluido chiuso si trasmette inalterata ovunque (torchio idraulico, freni).</dd>
        <dt>Principio di Archimede</dt><dd>Spinta verso l'alto <span class="mono">S = ρ_fluido·g·V_immerso</span>, pari al peso del fluido spostato.</dd>
        <dt>Equazione di continuità</dt><dd><span class="mono">A₁·v₁ = A₂·v₂</span> — la portata si conserva: sezione stretta ⇒ velocità alta.</dd>
        <dt>Equazione di Bernoulli</dt><dd><span class="mono">p + ½ρv² + ρgh = costante</span> — conservazione dell'energia lungo la linea di corrente.</dd>
        <dt>Teorema di Torricelli</dt><dd><span class="mono">v = √(2gh)</span> — velocità di efflusso da un foro a profondità <var>h</var>.</dd>
        <dt>Effetto Venturi</dt><dd>In una strozzatura la velocità aumenta e la pressione diminuisce.</dd>
      </dl>

      <h2>Termini utili</h2>
      <dl class="gloss">
        <dt>Linee di corrente</dt><dd>Traiettorie seguite dalle particelle di fluido; dove sono più fitte, il fluido è più veloce.</dd>
        <dt>Regime stazionario</dt><dd>In ogni punto la velocità del fluido non cambia nel tempo.</dd>
        <dt>Regime laminare</dt><dd>Il fluido scorre ordinato, a strati paralleli (Re basso).</dd>
        <dt>Regime turbolento</dt><dd>Il fluido forma vortici e mescolamenti disordinati (Re alto).</dd>
        <dt>Portanza</dt><dd>Spinta verso l'alto su un'ala, dovuta alla minor pressione dove l'aria è più veloce.</dd>
      </dl>

// formattazione numerica all'italiana (virgola decimale)
function pnum(v) {
  if (typeof v !== 'number') return v;
  if (!isFinite(v)) return '—';
  if (v === 0) return '0';
  const a = Math.abs(v);
  let s = (a < 1e-4 || a >= 1e7) ? v.toExponential(3) : String(parseFloat(v.toPrecision(6)));
  return s.replace('.', ',');
}

      F1: { lab: 'F₁ — forza da applicare (inversa)', unit: 'N', needs: ['F2', 'ratio'], run: x => { const r = x.F2 / x.ratio; return { value: r, resultText: `F₁ = ${pnum(r)} N`, steps: ['Parto da F₂ = F₁·(A₂/A₁)', 'Isolo F₁: F₁ = F₂ / (A₂/A₁)', `Sostituisco: F₁ = ${pnum(x.F2)} / ${pnum(x.ratio)}`, `Calcolo: F₁ = ${pnum(r)} N`] }; } },
      ratio: { lab: 'A₂/A₁ — rapporto delle aree (inversa)', unit: '(adim.)', needs: ['F2', 'F1'], run: x => { const r = x.F2 / x.F1; return { value: r, resultText: `A₂/A₁ = ${pnum(r)}`, steps: ['Parto da F₂ = F₁·(A₂/A₁)', 'Isolo il rapporto: A₂/A₁ = F₂/F₁', `Sostituisco: A₂/A₁ = ${pnum(x.F2)} / ${pnum(x.F1)}`, `Calcolo: A₂/A₁ = ${pnum(r)}`] }; } }

      h2: { lab: 'h₂ — altezza colonna 2 (inversa)', unit: 'm o cm', needs: ['rho1', 'h1', 'rho2'], run: x => { const r = x.rho1 * x.h1 / x.rho2; return { value: r, resultText: `h₂ = ${pnum(r)}`, steps: ['Parto da ρ₁·h₁ = ρ₂·h₂', 'Isolo h₂: h₂ = ρ₁·h₁ / ρ₂', `Sostituisco: h₂ = ${pnum(x.rho1)}·${pnum(x.h1)} / ${pnum(x.rho2)}`, `Calcolo: h₂ = ${pnum(r)} (stessa unità di h₁)`] }; } }

    targets: {
